<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Profile | AgriQ Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root {
            --primary: #0084ff; --bg: #f8fafc; --surface: #ffffff;
            --text-main: #0f172a; --text-dim: #64748b; --border: #e2e8f0;
            
            /* Premium Gamification Colors */
            --color-gold: #fbbf24;     
            --color-diamond: #a855f7;  
            --color-legend: #ef4444;   
            --warning: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg); margin: 0; color: var(--text-main); 
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        /* Ambient Background Mesh */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(0, 132, 255, 0.05), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05), transparent 25%);
            animation: breathe 10s ease-in-out infinite alternate;
        }
        @keyframes breathe { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        /* Header */
        header { 
            padding: 20px 24px; background: rgba(255,255,255,0.8); 
            backdrop-filter: blur(20px); position: sticky; top: env(safe-area-inset-top); z-index: 100;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 30px rgba(0,0,0,0.03);
        }
        .brand { font-weight: 900; font-size: 20px; letter-spacing: -1px; }

        main { padding: 25px 20px; max-width: 500px; margin: 0 auto; position: relative; z-index: 1;}

        /* --- GAMIFIED PROFILE PALLET --- */
        .profile-pallet {
            background: var(--surface); padding: 35px 20px 25px; border-radius: 32px;
            text-align: center; border: 1px solid var(--border); margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03); position: relative;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.5s ease; overflow: hidden; backdrop-filter: blur(20px);
        }
        
        .admin-tag { 
            display: none; position: absolute; top: 15px; background: #8b5cf6; color: white;
            padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4); z-index: 10;
        }

        /* Avatar & Frame Engine */
        .frame-container {
            position: relative; width: 140px; height: 140px; 
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px; transition: filter 0.5s;
        }
        
        .avatar-initial {
            width: 88px; height: 88px; background: linear-gradient(135deg, var(--primary), #00c6ff);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 36px; font-weight: 900; font-family: 'JetBrains Mono';
            z-index: 1; position: relative; box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
            border: 2px solid var(--border); overflow: hidden;
        }
        
        .user-photo { width: 100%; height: 100%; object-fit: cover; display: none; }

        .upload-btn {
            position: absolute; bottom: -5px; right: 20px; background: white; border: 1px solid var(--border);
            border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; box-shadow: 0 5px 10px rgba(0,0,0,0.1); color: var(--primary);
        }

        /* SVG Frames Layering */
        .svg-frame { position: absolute; z-index: 2; pointer-events: none; opacity: 0; transition: all 0.5s ease; transform: scale(0.8); }
        .tier-gold .frame-g { opacity: 1; transform: scale(1.05); }
        .tier-diamond .frame-d { opacity: 1; transform: scale(1.1); }
        .tier-legend .frame-l { opacity: 1; transform: scale(1.35); } 

        .aura-layer {
            position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
            border-radius: 50%; z-index: 0; opacity: 0; filter: blur(25px);
            transition: all 0.5s ease;
        }

        .tier-badge { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; padding: 6px 14px; border-radius: 20px; margin-bottom: 8px; background: #f1f5f9; color: var(--text-dim); transition: all 0.5s; }
        .user-name { font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: -0.5px; margin: 0 0 5px 0; transition: color 0.5s; }
        .user-email { color: var(--text-dim); font-size: 13px; font-weight: 600; margin: 0 0 15px 0; }

        /* XP Progress Bar Embedded */
        .xp-container { width: 100%; background: #f8fafc; padding: 15px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px;}
        .xp-text { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
        .xp-text span.val { color: var(--text-main); font-family: 'JetBrains Mono'; font-size: 12px;}
        .progress-track { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; border-radius: 10px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s; }

        /* --- TIER SPECIFIC STYLES --- */
        .tier-base .progress-fill { background: #94a3b8; }
        .tier-gold .aura-layer { background: var(--color-gold); opacity: 0.25; }
        .tier-gold .tier-badge { color: #d97706; background: #fef3c7; }
        .tier-gold .progress-fill { background: linear-gradient(90deg, #d97706, #fde047); }
        .tier-gold .avatar-initial { border-color: #fbbf24; }
        .tier-diamond .aura-layer { background: var(--color-diamond); opacity: 0.2; }
        .tier-diamond .tier-badge { color: #d946ef; background: #fae8ff; border: 1px solid rgba(217, 70, 239, 0.3); }
        .tier-diamond .progress-fill { background: linear-gradient(90deg, #7e22ce, #d946ef); }
        .tier-diamond .avatar-initial { border-color: #a855f7; }

        /* --- ADMIT CARD WIDGET --- */
        .admit-card-widget {
            background: var(--surface); border-radius: 24px; padding: 25px; border: 1px solid var(--border);
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden;
        }
        .admit-card-widget::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
            background: var(--primary); border-radius: 24px 0 0 24px;
        }
        .ac-header { display: flex; justify-content: space-between; align-items: center; }
        .ac-title { font-size: 16px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 8px;}
        .ac-status { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 12px; letter-spacing: 1px; text-transform: uppercase;}
        
        .ac-status.pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
        .ac-status.rejected { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .ac-status.accepted { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }

        .ac-body { font-size: 13px; color: var(--text-dim); line-height: 1.5; font-weight: 500; margin: 0; background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px dashed var(--border);}
        .ac-body.error-text { color: var(--danger); background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.2); }
        
        .btn-ac {
            width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 800; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition);
        }
        .btn-apply { background: rgba(0, 132, 255, 0.1); color: var(--primary); border: 1px solid rgba(0, 132, 255, 0.2); }
        .btn-apply:hover { background: var(--primary); color: white; }
        
        .btn-download { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(0, 132, 255, 0.2); }
        .btn-download.locked { background: #f1f5f9; color: var(--text-dim); box-shadow: none; cursor: not-allowed; border: 1px solid var(--border);}
        .btn-download:not(.locked):hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 132, 255, 0.3); }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 24px; text-align: center; }
        .stat-val { display: block; font-size: 24px; font-weight: 900; color: var(--primary); font-family: 'JetBrains Mono'; }
        .stat-label { font-size: 10px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-top: 5px; display: block; }

        /* Action Menu */
        .menu-card { background: var(--surface); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
        .menu-item { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: #f8fafc; }
        .menu-left { display: flex; align-items: center; gap: 12px; }

        /* Logout Button */
        .btn-logout { width: 100%; padding: 20px; border-radius: 20px; border: none; background: #fff1f2; color: #e11d48; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: var(--transition); border: 1px solid #ffe4e6; }
        .btn-logout:active { transform: scale(0.98); }

        /* Nav Bar */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 15px 10px calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 100; }
        .nav-item { color: var(--text-dim); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; transition: var(--transition); }
        .nav-item.active { color: var(--primary); transform: translateY(-2px); }

        /* Custom Modal & Toast */
        #modal-overlay { position: fixed; inset: 0; background: rgba(0, 45, 77, 0.4); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 24px; }
        .modal { background: white; padding: 30px; border-radius: 32px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); animation: fadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-btn { padding: 16px 24px; border-radius: 16px; border: none; font-weight: 800; cursor: pointer; flex: 1; transition: var(--transition); }
        .modal-input { width: 100%; padding: 16px; border-radius: 16px; border: 1.5px solid var(--border); margin-top: 15px; font-weight: 700; outline: none; text-align: center; text-transform: uppercase; }

        #toast { position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 14px 24px; border-radius: 50px; font-size: 13px; font-weight: 700; display: none; z-index: 10001; animation: slideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); white-space: nowrap; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div id="toast"></div>

    <div id="modal-overlay">
        <div class="modal">
            <h3 id="m-title" style="margin-top:0; font-weight:900;">Title</h3>
            <div id="m-body">
                <p id="m-text" style="color:var(--text-dim); font-size:14px; line-height:1.5; font-weight:600;">Message</p>
            </div>
            <div style="display:flex; gap:12px; margin-top:25px;">
                <button class="modal-btn" style="background:#f1f5f9; color:var(--text-dim);" onclick="closeModal()" id="m-cancel">Cancel</button>
                <button class="modal-btn" style="background:var(--primary); color:white" id="m-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <header>
        <div class="brand">PROFILE</div>
        <i data-lucide="settings" size="22" style="color:var(--text-dim); cursor:pointer;" onclick="showToast('Settings coming soon!')"></i>
    </header>

    <main>
        
        <div class="profile-pallet tier-base" id="profile-widget">
            <div class="admin-tag" id="admin-badge"><i data-lucide="shield-alert" size="12" style="display:inline; margin-right:4px;"></i> ADMIN</div>
            
            <div class="frame-container">
                <div class="aura-layer"></div>
                <div class="avatar-initial" id="avatar-container">
                    <span id="user-initial">U</span>
                    <img id="user-photo" class="user-photo" alt="Profile">
                </div>
                <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
                <div class="upload-btn" id="upload-btn" onclick="document.getElementById('photo-upload').click()">
                    <i data-lucide="camera" size="16"></i>
                </div>

                <svg class="svg-frame frame-g" viewBox="0 0 140 140" width="100%" height="100%">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#bf953f" />
                            <stop offset="25%" stop-color="#fcf6ba" />
                            <stop offset="50%" stop-color="#b38728" />
                            <stop offset="75%" stop-color="#fbf5b7" />
                            <stop offset="100%" stop-color="#aa771c" />
                        </linearGradient>
                    </defs>
                    <rect x="15" y="15" width="110" height="110" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
                    <rect x="22" y="22" width="96" height="96" rx="22" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.8"/>
                </svg>

                <svg class="svg-frame frame-d" viewBox="0 0 140 140" width="100%" height="100%">
                    <defs>
                        <linearGradient id="diaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#7e22ce" /><stop offset="100%" stop-color="#06b6d4" />
                        </linearGradient>
                    </defs>
                    <rect x="18" y="18" width="104" height="104" rx="26" fill="none" stroke="url(#diaGrad)" stroke-width="5"/>
                </svg>
            </div>

            <div class="tier-badge" id="tier-text">Initiate Rank</div>
            <h2 class="user-name" id="user-name">Loading...</h2>
            <p class="user-email" id="user-email">email@example.com</p>

            <div class="xp-container">
                <div class="xp-text">
                    <span id="rank-dest">Next: Gold Tier</span>
                    <span class="val"><span id="current-xp">0</span> / <span id="target-xp">1000</span> XP</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="xp-bar"></div></div>
            </div>
        </div>

        <div class="admit-card-widget" id="ac-widget">
            <div class="ac-header">
                <h3 class="ac-title"><i data-lucide="id-card" color="var(--primary)"></i> Sunday Grand Test</h3>
                <span class="ac-status" id="ac-badge">CHECKING</span>
            </div>
            <div id="ac-content">
                <p class="ac-body"><i data-lucide="loader-2" class="spin" size="14"></i> Syncing status...</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-val" id="tests-val">0</span>
                <span class="stat-label">Tests Solved</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="acc-val">0%</span>
                <span class="stat-label">Avg Accuracy</span>
            </div>
        </div>

        <div class="menu-card">
            <div class="menu-item" id="admin-panel-btn" style="display: none;" onclick="window.location.href='admin.html'">
                <div class="menu-left"><i data-lucide="shield" size="20" color="#8b5cf6"></i> Admin Control Panel</div>
                <i data-lucide="chevron-right" size="16" color="var(--text-dim)"></i>
            </div>
            <div class="menu-item" onclick="requestNameChange()">
                <div class="menu-left"><i data-lucide="user-square" size="20" color="var(--primary)"></i> Edit Display Name</div>
                <i data-lucide="chevron-right" size="16" color="var(--text-dim)"></i>
            </div>
            <div class="menu-item" onclick="showToast('Verification successful. Account is secure.', 'shield-check')">
                <div class="menu-left"><i data-lucide="shield-check" size="20" color="#10b981"></i> Account Status</div>
                <span style="font-size:11px; color:#10b981; background:#ecfdf5; padding:4px 8px; border-radius:10px;">VERIFIED PRO</span>
            </div>
        </div>

        <button class="btn-logout" onclick="confirmLogout()">
            <i data-lucide="log-out" size="20"></i> LOGOUT SESSION
        </button>
    </main>

    <nav class="nav-bar">
        <a href="dashboard.html" class="nav-item"><i data-lucide="layout-grid"></i>Dashboard</a>
        <a href="leaderboard.html" class="nav-item"><i data-lucide="bar-chart-3"></i>Rank</a>
        <a href="courses.html" class="nav-item"><i data-lucide="library" size="22"></i>Courses</a>
        <a href="profile.html" class="nav-item active"><i data-lucide="user"></i>Profile</a>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBFYdQZI4NXaqtWd4rEz3yL-0nw6PJqG6I",
            authDomain: "agri-mcar.firebaseapp.com",
            databaseURL: "https://agri-mcar-default-rtdb.firebaseio.com",
            projectId: "agri-mcar",
            storageBucket: "agri-mcar.firebasestorage.app",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();
        lucide.createIcons();

        let hasPurchased = false; 
        let cachedAdmitData = null; 

        // TIER SYSTEM
        const tiers = [
            { id: "tier-base", name: "Initiate", threshold: 0, next: 1000 },
            { id: "tier-gold", name: "Gold Tier", threshold: 1000, next: 5000 },
            { id: "tier-diamond", name: "Diamond", threshold: 5000, next: 10000 },
        ];

        // --- INSTANT OFFLINE CACHE LOAD ---
        function loadOfflineCache(uid) {
            const cacheKey = `agriq_profile_cache_${uid}`;
            const cached = JSON.parse(localStorage.getItem(cacheKey));
            if (!cached) return;

            if (cached.name) {
                document.getElementById('user-name').innerText = cached.name;
                document.getElementById('user-initial').innerText = cached.name[0].toUpperCase();
            }
            if (cached.photoURL) {
                document.getElementById('user-photo').src = cached.photoURL;
                document.getElementById('user-photo').style.display = 'block';
                document.getElementById('user-initial').style.display = 'none';
                document.getElementById('upload-btn').style.display = 'none';
            }
            if (cached.tests !== undefined) document.getElementById('tests-val').innerText = cached.tests;
            if (cached.acc !== undefined) document.getElementById('acc-val').innerText = `${cached.acc}%`;
            if (cached.xp !== undefined) applyTierSystem(cached.xp);
            
            if (cached.admitStatus) {
                renderAdmitCardUI(cached.admitStatus, cached.admitData, cached.hasPurchased);
            }
        }

        function updateOfflineCache(uid, partialData) {
            const cacheKey = `agriq_profile_cache_${uid}`;
            const existing = JSON.parse(localStorage.getItem(cacheKey)) || {};
            const updated = { ...existing, ...partialData };
            localStorage.setItem(cacheKey, JSON.stringify(updated));
        }

        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = 'login.html';
            else {
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-initial').innerText = (user.displayName || user.email)[0].toUpperCase();
                
                if (user.email === 'vishalchalse007@gmail.com') {
                    document.getElementById('admin-panel-btn').style.display = 'flex';
                    document.getElementById('admin-badge').style.display = 'flex';
                }
                
                loadOfflineCache(user.uid);
                fetchProfileData(user.uid);
                fetchAdmitCardStatus(user.uid);
            }
        });

        // --- STRICTLY LOCKED ADMIT CARD UI ---
        function renderAdmitCardUI(status, reqData, purchased) {
            const badge = document.getElementById('ac-badge');
            const content = document.getElementById('ac-content');
            
            if (!status || status === 'none') {
                badge.style.display = 'none';
                content.innerHTML = `
                    <p class="ac-body" style="margin-bottom: 15px;">You have not applied for the Sunday Grand Test offline array access.</p>
                    <button class="btn-ac btn-apply" onclick="window.location.href='admit-card-generator.html'">
                        <i data-lucide="file-signature" size="16"></i> Apply for Admit Card
                    </button>
                `;
            } else if (status === 'pending') {
                badge.style.display = 'inline-block';
                badge.className = 'ac-status pending'; badge.innerText = 'PENDING';
                content.innerHTML = `<p class="ac-body"><i data-lucide="clock" size="14" style="display:inline; vertical-align:middle; margin-right:4px;"></i> Application submitted. Awaiting administrative review and verification.</p>`;
            } else if (status === 'rejected') {
                badge.style.display = 'inline-block';
                badge.className = 'ac-status rejected'; badge.innerText = 'REJECTED';
                content.innerHTML = `
                    <p class="ac-body error-text" style="margin-bottom: 15px;"><strong>Reason:</strong> ${reqData?.feedback || 'Invalid details provided.'}</p>
                    <button class="btn-ac btn-apply" onclick="window.location.href='admit-card-generator.html'">
                        <i data-lucide="refresh-ccw" size="16"></i> Update & Re-Apply
                    </button>
                `;
            } else if (status === 'accepted') {
                cachedAdmitData = reqData; 
                badge.style.display = 'inline-block';
                badge.className = 'ac-status accepted'; badge.innerText = 'APPROVED';
                
                if (purchased) {
                    // Fully unlocked - Give them the App ID Code
                    content.innerHTML = `
                        <p class="ac-body" style="margin-bottom: 15px; background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2);">
                            <strong>App ID (Test Code):</strong> <span style="font-family:'JetBrains Mono'; color:var(--primary); font-weight:900; font-size:15px;">${reqData?.appId || ''}</span><br>
                            Your identity is verified. Use this code to access your test.
                        </p>
                        <button class="btn-ac btn-download" id="dl-pdf-btn" onclick="generateStudentPDF()">
                            <i data-lucide="download" size="16"></i> Download Official PDF
                        </button>
                    `;
                } else {
                    // Strictly Locked - Application approved but course NOT purchased
                    content.innerHTML = `
                        <p class="ac-body" style="margin-bottom: 15px; background: rgba(245, 158, 11, 0.05); border-color: rgba(245, 158, 11, 0.2); color: var(--warning);">
                            <strong><i data-lucide="lock" size="14" style="display:inline; vertical-align:middle; margin-right:4px;"></i> Test Code Locked</strong><br>
                            Your application is approved. Please purchase the course to reveal your Test Code and download the Admit Card.
                        </p>
                        <button class="btn-ac btn-download locked" id="dl-pdf-btn" onclick="showToast('You must purchase the course to unlock your code.')">
                            <i data-lucide="lock" size="16"></i> Purchase Course to Unlock
                        </button>
                    `;
                }
            }
            lucide.createIcons();
        }

        function fetchAdmitCardStatus(uid) {
            db.ref(`students/${uid}/purchases`).on('value', purchaseSnap => {
                const purchases = purchaseSnap.val() || {};
                hasPurchased = Object.keys(purchases).length > 0; 

                db.ref(`admit_card_requests/${uid}`).on('value', snap => {
                    const req = snap.val();
                    const status = req ? req.status : 'none';
                    renderAdmitCardUI(status, req, hasPurchased);
                    
                    updateOfflineCache(uid, { admitStatus: status, admitData: req, hasPurchased });
                });
            });
        }

        function generateStudentPDF() {
            if(!hasPurchased) return showToast("You must purchase the course to download the admit card.");
            if(!cachedAdmitData) return showToast("Data error. Cannot generate PDF.");

            showToast("Rendering Official Admit Card...");
            const btn = document.getElementById('dl-pdf-btn');
            btn.innerHTML = `<i data-lucide="loader-2" class="spin" size="16"></i> Rendering...`;
            lucide.createIcons();

            setTimeout(() => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const pageWidth = doc.internal.pageSize.width;
                    const pageHeight = doc.internal.pageSize.height;

                    const pdfData = {
                        'Application ID:': cachedAdmitData.appId,
                        'Full Name:': cachedAdmitData.fullName,
                        'Mother\'s Name:': cachedAdmitData.motherName,
                        'Father\'s Name:': cachedAdmitData.fatherName,
                        'Date of Birth:': cachedAdmitData.dob,
                        'Gender:': cachedAdmitData.gender,
                        'Category:': cachedAdmitData.category,
                        'District:': cachedAdmitData.district,
                        'Target Exam:': 'SUNDAY GRAND TEST - AGRIQ PRO',
                    };
                    
                    // Design matching Admin generation
                    doc.setFillColor(248, 250, 252); doc.rect(0, 0, pageWidth, pageHeight, 'F');
                    doc.setFillColor(0, 114, 255); doc.rect(14, 14, pageWidth - 28, 40, 'F');
                    
                    doc.setFont("helvetica", "bold"); doc.setFontSize(24); doc.setTextColor(255, 255, 255);
                    doc.text("AGRIQ PRO PLATFORM", pageWidth / 2, 30, { align: "center", charSpace: 1 });
                    doc.setFontSize(11); doc.setFont("helvetica", "normal"); doc.setTextColor(224, 242, 254);
                    doc.text("SECURE ADMIT CARD & SUNDAY TEST ACCESS", pageWidth / 2, 38, { align: "center" });
                    
                    doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(15, 23, 42); 
                    doc.text("CANDIDATE DETAILS", pageWidth / 2, 65, { align: "center" });

                    let yPos = 75; const startX = 18; const labelW = 55; const valueW = 115; const rowH = 10;
                    let rowCount = 0;

                    for (const [key, val] of Object.entries(pdfData)) {
                        if (rowCount % 2 === 0) doc.setFillColor(241, 245, 249); else doc.setFillColor(255, 255, 255); 
                        doc.rect(startX, yPos, (rowCount < 5) ? labelW + valueW - 35 : labelW + valueW, rowH, 'F'); 
                        doc.setFontSize(10); doc.setTextColor(71, 85, 105); doc.text(key, startX + 4, yPos + 7);
                        doc.setTextColor(15, 23, 42); if (key === 'Target Exam:') doc.setTextColor(0, 114, 255); 
                        doc.text(val ? val.toString().toUpperCase() : '-', startX + labelW, yPos + 7);
                        yPos += rowH; rowCount++;
                    }

                    // Photo & Stamps
                    const photoX = startX + labelW + valueW - 30; const photoY = 75;
                    doc.setDrawColor(15, 23, 42); doc.setLineWidth(0.6); doc.rect(photoX - 1.5, photoY - 1.5, 33, 43, 'S');
                    if(cachedAdmitData.photoBase64) doc.addImage(cachedAdmitData.photoBase64, 'JPEG', photoX, photoY, 30, 40);

                    // Accepted Seal
                    doc.setDrawColor(16, 185, 129); doc.setLineWidth(0.8);
                    doc.circle(photoX + 25, photoY + 35, 10, 'S'); doc.circle(photoX + 25, photoY + 35, 8.5, 'S');
                    doc.setFontSize(5); doc.setTextColor(16, 185, 129);
                    doc.text("AGRIQ PRO", photoX + 25, photoY + 34, { align: "center", angle: -15 });
                    doc.setFontSize(6); doc.text("ACCEPTED", photoX + 25, photoY + 37, { align: "center", angle: -15 });

                    // Coordinator Signature
                    const signY = yPos + 15;
                    doc.setFont("times", "italic"); doc.setFontSize(18); doc.setTextColor(0, 85, 255);
                    doc.text("Coordinator", photoX + 15, signY + 12, { align: "center", angle: -5 });
                    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(15, 23, 42);
                    doc.text("Admissions Coordinator", photoX + 15, signY + 22, { align: "center" });

                    doc.save(`AgriQ_AdmitCard_${cachedAdmitData.appId}.pdf`);
                    
                    btn.innerHTML = `<i data-lucide="download" size="16"></i> Download Official PDF`;
                    lucide.createIcons();
                } catch(e) {
                    showToast("Error generating PDF.");
                    btn.innerHTML = `<i data-lucide="download" size="16"></i> Download Official PDF`;
                    lucide.createIcons();
                }
            }, 500);
        }

        // --- PROFILE LOGIC ---
        function fetchProfileData(uid) {
            db.ref(`students/${uid}`).on('value', snap => {
                const data = snap.val();
                if (data) {
                    const name = data.name || "STUDENT";
                    document.getElementById('user-name').innerText = name;
                    document.getElementById('user-initial').innerText = name[0].toUpperCase();
                    if (data.photoURL) {
                        document.getElementById('user-photo').src = data.photoURL;
                        document.getElementById('user-photo').style.display = 'block';
                        document.getElementById('user-initial').style.display = 'none';
                        document.getElementById('upload-btn').style.display = 'none';
                    } else {
                        document.getElementById('upload-btn').style.display = 'flex'; 
                    }
                    
                    updateOfflineCache(uid, { name, photoURL: data.photoURL || null });
                }
            });

            db.ref('leaderboard').on('value', snap => {
                let totalPoints = 0; let userTotalAcc = 0; let userTests = 0;
                snap.forEach(child => {
                    const entry = child.val();
                    if (entry.uid === uid) {
                        totalPoints += (parseInt(entry.score) || 0);
                        userTotalAcc += (parseFloat(entry.accuracy) || 0);
                        userTests++;
                    }
                });
                
                const avgAcc = userTests > 0 ? Math.round(userTotalAcc / userTests) : 0;
                document.getElementById('tests-val').innerText = userTests;
                document.getElementById('acc-val').innerText = `${avgAcc}%`;
                applyTierSystem(totalPoints);
                
                updateOfflineCache(uid, { tests: userTests, acc: avgAcc, xp: totalPoints });
            });
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) return showToast("Image too large. Max 2MB allowed.");

            showToast("Uploading secure image...");
            const uid = auth.currentUser.uid;
            const uploadTask = storage.ref(`avatars/${uid}`).put(file);

            uploadTask.on('state_changed', null, 
                (error) => { showToast("Upload failed: " + error.message); }, 
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        db.ref(`students/${uid}`).update({ photoURL: downloadURL }).then(() => {
                            showToast("Profile Photo Locked!");
                            updateOfflineCache(uid, { photoURL: downloadURL });
                        });
                    });
                }
            );
        }

        function applyTierSystem(userXP) {
            let activeTier = tiers[0];
            for (let i = 0; i < tiers.length; i++) { if (userXP >= tiers[i].threshold) activeTier = tiers[i]; }

            const widget = document.getElementById('profile-widget');
            widget.className = `profile-pallet ${activeTier.id}`;
            document.getElementById('tier-text').innerText = activeTier.name;
            document.getElementById('current-xp').innerText = userXP.toLocaleString();
            document.getElementById('target-xp').innerText = activeTier.next.toLocaleString();
            
            const nextTierIndex = tiers.findIndex(t => t.id === activeTier.id) + 1;
            if(tiers[nextTierIndex]) document.getElementById('rank-dest').innerText = `Next: ${tiers[nextTierIndex].name}`;
            
            const xpInCurrentTier = userXP - activeTier.threshold;
            const totalXpRequiredForNext = activeTier.next - activeTier.threshold;
            const percentage = (xpInCurrentTier / totalXpRequiredForNext) * 100;
            document.getElementById('xp-bar').style.width = `${Math.min(percentage, 100)}%`;
        }

        function requestNameChange() {
            document.getElementById('m-title').innerText = "EDIT PROFILE";
            document.getElementById('m-body').innerHTML = `
                <p style="color:var(--text-dim); font-size:13px; margin:0 0 10px; font-weight:600;">Update your global display name.</p>
                <input type="text" id="name-input" class="modal-input" placeholder="ENTER NEW NAME">
            `;
            document.getElementById('m-cancel').style.display = 'block';
            document.getElementById('modal-overlay').style.display = 'flex';
            
            document.getElementById('m-confirm').onclick = () => {
                const newName = document.getElementById('name-input').value.trim().toUpperCase();
                if(newName.length < 3) return showToast("Name must be at least 3 characters!");
                const uid = auth.currentUser.uid;
                db.ref(`students/${uid}`).update({ name: newName }).then(() => { 
                    showToast("Profile Updated!"); 
                    updateOfflineCache(uid, { name: newName });
                    closeModal(); 
                });
            };
        }

        function confirmLogout() {
            document.getElementById('m-title').innerText = "END SESSION";
            document.getElementById('m-body').innerHTML = `<p style="color:var(--text-dim); font-size:14px; line-height:1.5; font-weight:600;">Are you sure you want to log out of AgriQ Pro?</p>`;
            const confirmBtn = document.getElementById('m-confirm');
            confirmBtn.style.background = '#e11d48'; confirmBtn.innerText = 'Logout';
            document.getElementById('modal-overlay').style.display = 'flex';
            confirmBtn.onclick = () => { 
                if (auth.currentUser) localStorage.removeItem(`agriq_profile_cache_${auth.currentUser.uid}`);
                auth.signOut().then(() => { window.location.href = 'login.html'; }); 
            };
        }

        function closeModal() { 
            document.getElementById('modal-overlay').style.display = 'none'; 
            document.getElementById('m-confirm').style.background = 'var(--primary)';
            document.getElementById('m-confirm').innerText = 'Confirm';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
