<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlphaCatch | Sky Cloud Controller</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs (Including Auth) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

  <style>
    :root {
      --sky-bg: #f0f9ff; --sky-surface: #ffffff;
      --sky-primary: #0ea5e9; --sky-primary-hover: #0284c7; --sky-accent: #38bdf8;
      --text-main: #334155; --text-muted: #94a3b8;
      --danger: #fb7185; --success: #34d399; --warning: #fbbf24;
      --shadow-soft: 0 12px 40px rgba(14, 165, 233, 0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    body { font-family: 'Plus Jakarta Sans', sans-serif; padding: 0; margin: 0; background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%); color: var(--text-main); min-height: 100vh; }
    
    /* Login Screen */
    #login-screen { position: fixed; inset: 0; background: var(--sky-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
    .login-box { background: white; padding: 40px; border-radius: 32px; box-shadow: var(--shadow-soft); text-align: center; max-width: 350px; width: 90%; }
    
    #app-content { display: none; padding: 20px; }

    .header { text-align: center; margin-bottom: 30px; position: relative; }
    .header h1 { margin: 0; font-size: 28px; color: var(--sky-primary); font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px;}
    .header p { margin: 5px 0 0 0; font-size: 14px; color: var(--text-muted); font-weight: 500; }
    
    .logout-btn { position: absolute; right: 20px; top: 10px; background: #f1f5f9; color: var(--text-main); border: none; padding: 10px 15px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 12px;}
    
    .global-settings { background: var(--sky-surface); padding: 15px 25px; border-radius: 100px; margin: 0 auto 30px auto; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; justify-content: center; box-shadow: var(--shadow-soft); max-width: 800px; }
    .global-settings label { margin: 0; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text-main);}
    .global-settings input[type="number"] { width: 60px; padding: 8px 12px; border-radius: 20px; text-align: center; border: 2px solid #f1f5f9; outline: none; font-weight: 700; color: var(--sky-primary);}
    
    .dashboards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto;}
    .card { background: var(--sky-surface); padding: 25px; border-radius: 32px; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.5); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { font-size: 18px; margin: 0; color: var(--text-main); font-weight: 800; display: flex; align-items: center; gap: 8px;}
    .tag { background: #e0f2fe; color: var(--sky-primary); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; }

    label { font-weight: 700; margin-top: 15px; display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    input[type="text"], textarea { width: 100%; padding: 14px 18px; margin: 8px 0; border: 2px solid #f1f5f9; border-radius: 20px; font-size: 13px; font-family: monospace; box-sizing: border-box; background: #f8fafc; transition: var(--transition); outline: none; }
    input:focus, textarea:focus { border-color: var(--sky-accent); background: #fff; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1); }
    textarea { height: 140px; resize: vertical; line-height: 1.5; }
    
    .input-group { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }
    .input-group input { margin: 0; }
    
    button { padding: 16px; font-size: 14px; color: white; border: none; border-radius: 20px; cursor: pointer; width: 100%; font-weight: 800; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
    button:active { transform: scale(0.97); }
    
    .btn-action-row { display: flex; gap: 10px; margin-top: 10px; }
    .btn-action-row button { margin: 0; }
    
    .btn-detect { background: #f1f5f9; color: var(--text-main); width: auto; padding: 14px 20px; }
    .btn-start { background: linear-gradient(135deg, var(--sky-accent) 0%, var(--sky-primary) 100%); box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3); }
    .btn-save { background: var(--text-main); color: #fff; }
    .btn-edit { background: #f1f5f9; color: var(--text-main); }
    .btn-reset { background: transparent; color: var(--danger); border: 2px dashed var(--danger); }
    
    .toast { margin-top: 15px; padding: 12px; border-radius: 16px; font-size: 13px; font-weight: 700; text-align: center; display: none; }
    .toast.info { background: #e0f2fe; color: var(--sky-primary); display: block; }
    .toast.success { background: #d1fae5; color: #059669; display: block; }
    
    /* Visual Progress Bar */
    .progress-box { background: #f0fdf4; border: 2px solid #d1fae5; padding: 15px; border-radius: 20px; margin-bottom: 15px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-text { font-size: 14px; font-weight: 800; color: #059669; }
    .progress-sub { font-size: 12px; color: #10b981; font-weight: 600;}
    
    .progress-track { width: 100%; height: 8px; background: #d1fae5; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: #059669; width: 0%; transition: width 0.5s ease-out; border-radius: 10px; }

    /* Custom Modal */
    #modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; opacity: 0; transition: opacity 0.3s ease;}
    .modal-box { background: var(--sky-surface); padding: 30px; border-radius: 32px; width: 100%; max-width: 360px; text-align: center; transform: translateY(20px); transition: transform 0.3s; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
    .modal-box h3 { margin: 0 0 10px 0; color: var(--text-main); font-weight: 800; font-size: 20px; }
    .modal-box p { color: var(--text-muted); font-size: 14px; line-height: 1.5; font-weight: 500; margin-bottom: 25px; word-break: break-word;}
    .modal-actions { display: flex; gap: 10px; }
    .modal-btn { flex: 1; padding: 14px; margin: 0; border-radius: 16px; border: none; font-weight: 800; cursor: pointer;}
    .m-cancel { background: #f1f5f9; color: var(--text-main); }
    .m-confirm { background: var(--sky-primary); color: white; }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div id="login-screen">
    <div class="login-box">
      <i data-lucide="cloud" size="48" color="var(--sky-primary)" style="margin-bottom: 15px;"></i>
      <h2 style="justify-content: center; margin-bottom: 5px;">SkyBase Admin</h2>
      <p style="color: var(--text-muted); font-size: 13px; font-weight: 600; margin-bottom: 25px;">Verified Email Access Only</p>
      <button class="btn-start" onclick="signInWithGoogle()"><i data-lucide="mail"></i> Sign in with Google</button>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="modal-overlay">
    <div class="modal-box" id="modal-box">
      <h3 id="m-title">Title</h3>
      <p id="m-text">Message</p>
      <div class="modal-actions">
        <button class="modal-btn m-cancel" id="m-cancel" onclick="closeModal()">Cancel</button>
        <button class="modal-btn m-confirm" id="m-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div id="app-content">
    <div class="header">
      <button class="logout-btn" onclick="signOut()"><i data-lucide="log-out"></i> Exit</button>
      <h1><i data-lucide="cloud"></i> SkyBase Controller</h1>
      <p>Cloud-synced Batch Orchestration <span id="connStatus" class="tag" style="background:#d1fae5; color:#059669; padding: 2px 8px; margin-left: 5px;">Offline</span></p>
    </div>

    <div class="global-settings">
      <label>Timer <input type="number" id="globalTimer" value="15" min="5"></label>
      <label>Delay <input type="number" id="globalDelay" value="5" min="0"></label>
      <label>Batch Size <input type="number" id="globalBatch" value="30" min="1"></label>
      <label><input type="checkbox" id="globalProtect" checked style="width: auto; margin:0; accent-color: var(--sky-primary);"> Protect Content</label>
    </div>

    <div class="dashboards">
      
      <!-- MODULE: IBPS -->
      <div class="card" id="module_ibps">
        <div class="card-header">
          <h2><i data-lucide="book-open"></i> IBPS</h2>
          <span class="tag">CLOUD SYNCED</span>
        </div>
        
        <label>Group Chat ID</label>
        <div class="input-group">
          <input type="text" id="chatId_ibps" placeholder="-100xxxxxxxxx">
          <button class="btn-detect" onclick="autoDetectGroup('ibps')"><i data-lucide="search"></i></button>
        </div>

        <div id="setup_ibps">
          <label>Cloud Database Upload (Raw Text or JSON)</label>
          <textarea id="data_ibps" placeholder='1. Question text... A. Option 1... Answer: A'></textarea>
          <div class="btn-action-row">
            <button class="btn-save" onclick="syncToCloud('ibps')" style="flex: 2;"><i data-lucide="cloud-upload"></i> Upload</button>
            <button class="btn-edit" onclick="readCloudData('ibps')" style="flex: 1;"><i data-lucide="download-cloud"></i> Edit</button>
          </div>
        </div>

        <div id="run_ibps" style="display:none;">
          <div class="progress-box">
            <div class="progress-header">
              <span class="progress-text" id="status_text_ibps">Progress: 0 / 0</span>
              <span class="progress-sub" id="next_ibps">Ready</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="pb_ibps"></div></div>
          </div>
          <button id="startBtn_ibps" class="btn-start" onclick="triggerWorker('ibps')"><i data-lucide="play"></i> Dispatch Next Batch</button>
          <button class="btn-reset" onclick="resetCloud('ibps')"><i data-lucide="trash-2"></i> Wipe Database</button>
        </div>
        
        <div id="toast_ibps" class="toast">Awaiting Data</div>
      </div>

      <!-- MODULE: MCAER -->
      <div class="card" id="module_mcaer">
        <div class="card-header">
          <h2><i data-lucide="leaf"></i> MCAER</h2>
          <span class="tag">CLOUD SYNCED</span>
        </div>
        
        <label>Group Chat ID</label>
        <div class="input-group">
          <input type="text" id="chatId_mcaer" placeholder="-100xxxxxxxxx">
          <button class="btn-detect" onclick="autoDetectGroup('mcaer')"><i data-lucide="search"></i></button>
        </div>

        <div id="setup_mcaer">
          <label>Cloud Database Upload (Raw Text or JSON)</label>
          <textarea id="data_mcaer" placeholder='1. Question text... A. Option 1... Answer: A'></textarea>
          <div class="btn-action-row">
            <button class="btn-save" onclick="syncToCloud('mcaer')" style="flex: 2;"><i data-lucide="cloud-upload"></i> Upload</button>
            <button class="btn-edit" onclick="readCloudData('mcaer')" style="flex: 1;"><i data-lucide="download-cloud"></i> Edit</button>
          </div>
        </div>

        <div id="run_mcaer" style="display:none;">
          <div class="progress-box">
            <div class="progress-header">
              <span class="progress-text" id="status_text_mcaer">Progress: 0 / 0</span>
              <span class="progress-sub" id="next_mcaer">Ready</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="pb_mcaer"></div></div>
          </div>
          <button id="startBtn_mcaer" class="btn-start" onclick="triggerWorker('mcaer')"><i data-lucide="play"></i> Dispatch Next Batch</button>
          <button class="btn-reset" onclick="resetCloud('mcaer')"><i data-lucide="trash-2"></i> Wipe Database</button>
        </div>
        
        <div id="toast_mcaer" class="toast">Awaiting Data</div>
      </div>

      <!-- MODULE: NET -->
      <div class="card" id="module_net">
        <div class="card-header">
          <h2><i data-lucide="graduation-cap"></i> NET</h2>
          <span class="tag">CLOUD SYNCED</span>
        </div>
        
        <label>Group Chat ID</label>
        <div class="input-group">
          <input type="text" id="chatId_net" placeholder="-100xxxxxxxxx">
          <button class="btn-detect" onclick="autoDetectGroup('net')"><i data-lucide="search"></i></button>
        </div>

        <div id="setup_net">
          <label>Cloud Database Upload (Raw Text or JSON)</label>
          <textarea id="data_net" placeholder='1. Question text... A. Option 1... Answer: A'></textarea>
          <div class="btn-action-row">
            <button class="btn-save" onclick="syncToCloud('net')" style="flex: 2;"><i data-lucide="cloud-upload"></i> Upload</button>
            <button class="btn-edit" onclick="readCloudData('net')" style="flex: 1;"><i data-lucide="download-cloud"></i> Edit</button>
          </div>
        </div>

        <div id="run_net" style="display:none;">
          <div class="progress-box">
            <div class="progress-header">
              <span class="progress-text" id="status_text_net">Progress: 0 / 0</span>
              <span class="progress-sub" id="next_net">Ready</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="pb_net"></div></div>
          </div>
          <button id="startBtn_net" class="btn-start" onclick="triggerWorker('net')"><i data-lucide="play"></i> Dispatch Next Batch</button>
          <button class="btn-reset" onclick="resetCloud('net')"><i data-lucide="trash-2"></i> Wipe Database</button>
        </div>
        
        <div id="toast_net" class="toast">Awaiting Data</div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
    const token = "8783125069:AAEQtewJ-ikqVhOakiJEazutduY-BPwyp7U"; 
    
    // FIREBASE INITIALIZATION
    const firebaseConfig = {
      apiKey: "AIzaSyBFYdQZI4NXaqtWd4rEz3yL-0nw6PJqG6I",
      authDomain: "agri-mcar.firebaseapp.com",
      databaseURL: "https://agri-mcar-default-rtdb.firebaseio.com",
      projectId: "agri-mcar"
    };
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // AUTHENTICATION GUARD
    auth.onAuthStateChanged(user => {
      if (user) {
        if (user.email === 'vishalchalse007@gmail.com') {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-content').style.display = 'block';
          initSystem();
        } else {
          auth.signOut();
          customAlert("Access Denied", "Unauthorized Email Address. This tool is locked.");
        }
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('app-content').style.display = 'none';
      }
    });

    function signInWithGoogle() { auth.signInWithPopup(provider).catch(err => customAlert("Auth Error", err.message)); }
    function signOut() { auth.signOut(); }

    // MODAL UTILITIES
    function customAlert(title, text) {
      document.getElementById('m-title').innerText = title;
      document.getElementById('m-text').innerText = text;
      document.getElementById('m-cancel').style.display = 'none';
      document.getElementById('m-confirm').innerText = "OK";
      document.getElementById('m-confirm').onclick = closeModal;
      openModal();
    }
    
    function customConfirm(title, text, onConfirm) {
      document.getElementById('m-title').innerText = title;
      document.getElementById('m-text').innerText = text;
      document.getElementById('m-cancel').style.display = 'block';
      document.getElementById('m-confirm').innerText = "Confirm";
      document.getElementById('m-confirm').onclick = () => { closeModal(); onConfirm(); };
      openModal();
    }

    function openModal() {
      document.getElementById('modal-overlay').style.display = 'flex';
      setTimeout(() => { 
        document.getElementById('modal-overlay').style.opacity = '1'; 
        document.getElementById('modal-box').style.transform = 'translateY(0)'; 
      }, 10);
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.opacity = '0';
      document.getElementById('modal-box').style.transform = 'translateY(20px)';
      setTimeout(() => { document.getElementById('modal-overlay').style.display = 'none'; }, 300);
    }

    function showToast(groupId, message, type) {
      const toastDiv = document.getElementById(`toast_${groupId}`);
      toastDiv.innerText = message;
      toastDiv.className = `toast ${type}`;
      setTimeout(() => { toastDiv.style.display = 'none'; }, 5000);
    }

    // PARSER & DATA MANAGEMENT
    function parseInputData(rawText) {
      rawText = rawText.trim();
      if(!rawText) return [];
      if (rawText.startsWith("[") || rawText.startsWith("{")) {
          try { let parsed = JSON.parse(rawText); return Array.isArray(parsed) ? parsed : [parsed]; } 
          catch(e) { return null; }
      }
      const lines = rawText.split('\n').map(line => line.trim()).filter(line => line !== '');
      const results = [];
      let currentItem = null;

      for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const qMatch = line.match(/^(\d+)\.\s*(.*)/);
          if (qMatch) {
              if (currentItem) results.push(currentItem);
              currentItem = { question: qMatch[2], options: [] };
          } else if (currentItem) {
              const optMatch = line.match(/^[A-Z]\.\s*(.*)/i);
              const ansMatch = line.match(/^Answer:\s*([A-Z])/i);
              if (optMatch) currentItem.options.push(optMatch[1]);
              else if (ansMatch) {
                  const letter = ansMatch[1].toUpperCase();
                  const index = letter.charCodeAt(0) - 65;
                  currentItem.answer = currentItem.options[index] || letter;
              } else {
                  if (currentItem.options.length === 0) currentItem.question += " " + line;
                  else currentItem.options[currentItem.options.length - 1] += " " + line;
              }
          }
      }
      if (currentItem) results.push(currentItem);
      return results;
    }

    // CLOUD SYNC & UI LOGIC
    let cloudDataState = {};

    function initSystem() {
      db.ref('.info/connected').on('value', snap => {
        const statusSpan = document.getElementById('connStatus');
        if (snap.val() === true) {
            statusSpan.innerText = "Online";
            statusSpan.style.background = "#d1fae5"; statusSpan.style.color = "#059669";
        } else {
            statusSpan.innerText = "Disconnected";
            statusSpan.style.background = "#ffe4e6"; statusSpan.style.color = "#e11d48";
        }
      });

      ['ibps', 'mcaer', 'net'].forEach(groupId => {
        db.ref(`sky_exams/${groupId}`).on('value', snap => {
          const data = snap.val();
          cloudDataState[groupId] = data;
          updateDashboardUI(groupId, data);
        });
      });
    }

    function syncToCloud(groupId) {
      const rawText = document.getElementById(`data_${groupId}`).value;
      const parsedArray = parseInputData(rawText);
      
      if(!parsedArray || parsedArray.length === 0) return customAlert("Format Error", "Invalid data format.");

      db.ref(`sky_exams/${groupId}`).update({
        questions: parsedArray,
        currentIndex: 0
      }).then(() => {
        showToast(groupId, `✅ Saved ${parsedArray.length} questions.`, "success");
        document.getElementById(`data_${groupId}`).value = "";
      }).catch(err => customAlert("Upload Blocked", err.message));
    }

    function readCloudData(groupId) {
      const data = cloudDataState[groupId];
      if (!data || !data.questions) return customAlert("Empty", "No questions exist in the database for this module.");
      
      document.getElementById(`data_${groupId}`).value = JSON.stringify(data.questions, null, 2);
      
      document.getElementById(`setup_${groupId}`).style.display = "block";
      document.getElementById(`run_${groupId}`).style.display = "none";
      showToast(groupId, "Data loaded into editor. Edit and click Upload to update.", "info");
    }

    function resetCloud(groupId) {
      customConfirm("Wipe Database?", `Delete all questions for ${groupId.toUpperCase()}?`, () => {
        db.ref(`sky_exams/${groupId}`).remove().then(() => showToast(groupId, "Database wiped.", "info")).catch(err => customAlert("Error", err.message));
      });
    }

    function updateDashboardUI(groupId, dbData) {
      const setupDiv = document.getElementById(`setup_${groupId}`);
      const runDiv = document.getElementById(`run_${groupId}`);
      
      if(dbData && dbData.questions) {
        const arr = dbData.questions;
        const currentIndex = dbData.currentIndex || 0;
        const batchSize = parseInt(document.getElementById("globalBatch").value) || 30;
        const endRange = Math.min(currentIndex + batchSize, arr.length);
        const triggerStatus = dbData.trigger ? dbData.trigger.status : "idle";

        // Update Text
        document.getElementById(`status_text_${groupId}`).innerText = `Progress: ${currentIndex} / ${arr.length}`;
        
        // Visual Progress Bar Math
        const percentage = arr.length === 0 ? 0 : (currentIndex / arr.length) * 100;
        document.getElementById(`pb_${groupId}`).style.width = `${percentage}%`;

        if (currentIndex >= arr.length) {
            document.getElementById(`next_${groupId}`).innerText = "🎉 Database Completed";
            document.getElementById(`pb_${groupId}`).style.background = "#0ea5e9"; // Sky blue when fully done
            document.getElementById(`startBtn_${groupId}`).style.display = "none";
        } else {
            document.getElementById(`pb_${groupId}`).style.background = "#059669"; // Green while running
            document.getElementById(`startBtn_${groupId}`).style.display = "flex";
            
            if (triggerStatus === "running") {
                document.getElementById(`next_${groupId}`).innerText = "⚡ Test Running...";
                document.getElementById(`startBtn_${groupId}`).style.display = "none";
            } else if (triggerStatus === "pending") {
                document.getElementById(`next_${groupId}`).innerText = "⏳ Worker Starting...";
                document.getElementById(`startBtn_${groupId}`).style.display = "none";
            } else {
                document.getElementById(`next_${groupId}`).innerText = `Next: Q${currentIndex + 1} to Q${endRange}`;
            }
        }

        setupDiv.style.display = "none";
        runDiv.style.display = "block";
      } else {
        setupDiv.style.display = "block";
        runDiv.style.display = "none";
      }
    }

    document.getElementById("globalBatch").addEventListener('change', () => {
      ['ibps', 'mcaer', 'net'].forEach(g => updateDashboardUI(g, cloudDataState[g]));
    });

    // Auto Detect Chat ID
    async function autoDetectGroup(groupId) {
      try {
        const res = await fetch(`https://api.telegram.org/bot${token}/getUpdates?limit=100`);
        const data = await res.json();
        if (data.ok && data.result.length > 0) {
          for (let i = data.result.length - 1; i >= 0; i--) {
            let msg = data.result[i].message || data.result[i].my_chat_member;
            if (msg && msg.chat && (msg.chat.type === "group" || msg.chat.type === "supergroup")) {
              document.getElementById(`chatId_${groupId}`).value = msg.chat.id;
              return showToast(groupId, `✅ Linked to: ${msg.chat.title}`, "success");
            }
          }
        }
        customAlert("Not Found", "Send a message in your Telegram group first, then try again.");
      } catch (e) { customAlert("Network Error", "Could not connect to Telegram."); }
    }

    // Trigger Worker
    function triggerWorker(groupId) {
      const chatId = document.getElementById(`chatId_${groupId}`).value.trim();
      if(!chatId) return customAlert("Missing Info", "Please detect or enter your Group Chat ID first.");

      const timerSec = parseInt(document.getElementById("globalTimer").value) || 15;
      const delayGap = parseInt(document.getElementById("globalDelay").value) || 5;
      const batchSize = parseInt(document.getElementById("globalBatch").value) || 30;
      const isProtected = document.getElementById("globalProtect").checked;

      db.ref(`sky_exams/${groupId}/trigger`).set({
        status: "pending",
        chatId: chatId,
        batchSize: batchSize,
        timerSec: timerSec,
        delayGap: delayGap,
        protectContent: isProtected,
        timestamp: Date.now()
      }).then(() => {
        showToast(groupId, "🚀 Worker dispatched! You can now close this page.", "success");
      }).catch(err => customAlert("Trigger Blocked", err.message));
    }
  </script>
</body>
</html>
