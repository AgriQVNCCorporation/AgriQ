<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f0f9ff">
    <title>AgriQ Pro | Active Sky Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0084ff;
            --primary-glow: rgba(0, 132, 255, 0.1);
            --bg: #f0f9ff;
            --surface: #ffffff;
            --text-main: #002d4d;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --success-glow: rgba(34, 197, 94, 0.15);
            --warning: #eab308;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at top right, #e0f2fe, transparent);
            margin: 0; 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #app-loader {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #app-loader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; transition: 0.6s; }
        
        /* PAUSE OVERLAY STYLES */
        #pause-overlay {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(15px);
            z-index: 9998; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }

        header {
            padding: calc(env(safe-area-inset-top) + 15px) 24px 15px; 
            background: var(--glass); 
            backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 1000;
        }

        .timer-badge { 
            background: #fff; color: var(--primary); padding: 8px 16px; 
            border-radius: 12px; border: 1.5px solid var(--border); 
            font-family: 'JetBrains Mono'; font-weight: 800; font-size: 14px;
        }

        .profile-container { width: 42px; height: 42px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; }

        main { 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            width: 100%; 
            flex: 1; 
            padding-bottom: 200px;
        }

        .marker-scroll { 
            display: flex; gap: 10px; overflow-x: auto; padding: 5px 5px 20px 5px; 
            scrollbar-width: none; position: sticky; top: 80px; z-index: 999;
        }
        .marker-scroll::-webkit-scrollbar { display: none; }
        
        .q-pill { 
            min-width: 42px; height: 42px; border-radius: 12px; background: #fff; border: 1.5px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text-dim); flex-shrink: 0;
            cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        
        .q-pill.done { background: var(--success); border-color: var(--success); color: #fff; }
        .q-pill.marked { background: var(--warning); border-color: var(--warning); color: #fff; }
        .q-pill.active { border-color: var(--primary); color: var(--text-main); background: var(--primary-glow); border-width: 2px; }

        .q-card { background: #fff; border-radius: 28px; padding: 26px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        
        .q-number-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .retake-badge {
            display: none;
            background: #f1f5f9;
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            margin-left: 10px;
            vertical-align: middle;
        }

        .opt-box { 
            background: #fff; border: 1.5px solid var(--border); padding: 18px; 
            border-radius: 20px; margin-bottom: 12px; font-weight: 700; cursor: pointer; color: var(--text-main);
            transition: 0.2s; font-size: 14px; line-height: 1.4;
        }
        .opt-box.selected { border-color: var(--success); background: var(--success); color: #fff; box-shadow: 0 8px 20px var(--success-glow); }

        .controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 460px; padding: 16px; background: var(--glass);
            backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: 30px;
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            z-index: 1001;
        }

        .btn-row { display: flex; gap: 10px; }
        .btn-primary { flex: 1.5; padding: 16px; border-radius: 18px; border: none; background: var(--primary); color: #fff; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;}
        .btn-sec { flex: 1; padding: 16px; border-radius: 18px; background: #fff; color: var(--text-main); border: 1.5px solid var(--border); font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;}

        #custom-modal { position: fixed; inset: 0; background: rgba(0, 45, 77, 0.3); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 24px; backdrop-filter: blur(8px); }
        .modal-content { background: #fff; width: 100%; max-width: 350px; border-radius: 28px; padding: 30px; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app-loader">
        <div id="loader-icon" style="color:var(--primary);"><i data-lucide="cloud-lightning" size="64" fill="currentColor"></i></div>
        <p style="font-family:'JetBrains Mono'; font-size: 10px; color: var(--primary); margin-top: 15px; letter-spacing: 2px; font-weight: 800;">SYNCING SCALES...</p>
    </div>

    <div id="pause-overlay">
        <i data-lucide="pause-circle" size="72" color="var(--primary)" style="margin-bottom: 20px;"></i>
        <h2 style="font-size: 24px; font-weight: 900; color: var(--text-main); margin-bottom: 10px;">TEST PAUSED</h2>
        <p style="font-size: 14px; color: var(--text-dim); margin-bottom: 30px;">Your timer has been stopped. Do not close this tab.</p>
        <button class="btn-primary" style="width: auto; padding: 16px 40px;" onclick="togglePause()">RESUME TEST</button>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div id="modal-title" style="font-weight:900; margin-bottom:10px; text-transform:uppercase; color:var(--primary);">Alert</div>
            <div id="modal-text" style="font-size:13px; color:var(--text-dim); margin-bottom:25px;">Message</div>
            <div class="modal-actions" style="display:flex; gap:12px;">
                <button class="btn-sec" id="modal-cancel-btn">CANCEL</button>
                <button class="btn-primary" id="modal-confirm-btn">CONFIRM</button>
            </div>
        </div>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="profile-container" id="user-initial">U</div>
            <div>
                <div id="assessment-type-label" style="font-weight: 900; font-size: 9px; letter-spacing: 1px; color: var(--primary);">LIVE ASSESSMENT</div>
                <span id="user-display-name" style="font-weight:800; font-size:14px; color:var(--text-main);">STUDENT</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div id="q-timer" class="timer-badge">00:00</div>
            <button id="pause-btn" onclick="togglePause()" style="background:none; border:none; color:var(--primary); cursor:pointer; padding:5px; display:flex;">
                <i data-lucide="pause-circle" size="24"></i>
            </button>
        </div>
    </header>

    <main id="main-content">
        <div id="marker-grid" class="marker-scroll"></div>
        
        <div class="q-card">
            <span id="q-number" class="q-number-label">
                QUESTION <span id="q-current-count">--</span> OF <span id="q-total-count">--</span>
                <span id="retake-badge" class="retake-badge">RETAKE</span>
            </span>
            <div id="q-display" style="font-size: 17px; font-weight: 700; line-height: 1.6; color: var(--text-main);">Preparing your assessment...</div>
        </div>

        <div id="opts-display"></div>
    </main>

    <div class="controls" id="bottom-controls">
        <div class="btn-row">
            <button class="btn-sec" style="flex: 1;" onclick="changeQ(-1)"><i data-lucide="chevron-left" size="20"></i></button>
            
            <button class="btn-sec" id="mark-btn" style="flex: 2; border-color: var(--warning); color: var(--warning);" onclick="toggleMark()">
                MARK <i data-lucide="bookmark" size="18"></i>
            </button>
            
            <button class="btn-primary" style="flex: 1.5;" onclick="changeQ(1)">NEXT <i data-lucide="chevron-right" size="20"></i></button>
        </div>
        <button class="btn-primary" style="background:var(--danger); width: 100%;" onclick="submitTest()">
            FINISH ASSESSMENT <i data-lucide="check-circle" size="18"></i>
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBFYdQZI4NXaqtWd4rEz3yL-0nw6PJqG6I",
            authDomain: "agri-mcar.firebaseapp.com",
            databaseURL: "https://agri-mcar-default-rtdb.firebaseio.com",
            projectId: "agri-mcar"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let questions = [], currentIdx = 0, userChoices = {}, markedQuestions = {}, timer;
        let totalSecondsRemaining = 3600; 
        
        const params = new URLSearchParams(window.location.search);
        const moduleKey = params.get('mod');
        const folderKey = params.get('folder'); 
        const reviewIndexParam = params.get('reviewIndex');
        const isReviewMode = reviewIndexParam !== null;
        
        // Grab version, source, and random parameters from the URL
        const dbVersion = params.get('v');
        const sourceParam = params.get('source');
        const isRandomMode = params.get('random') === 'true';
        
        // Initialize Active Session ID
        let activeSessionId = folderKey ? `${folderKey}_${moduleKey}` : moduleKey; 
        if (dbVersion === '2') { activeSessionId += '_v2'; }
        
        const retakeParam = params.get('retake');
        const isRetake = retakeParam === 'true' || retakeParam === 'half';
        const isHalfXP = retakeParam === 'half';
        
        let isSubmitting = false;
        let isPaused = false;

        // Auto-save function to persist test progress
        function saveProgress() {
            if (isReviewMode || isSubmitting) return;
            const progress = {
                questions, 
                userChoices,
                markedQuestions,
                currentIdx,
                totalSecondsRemaining,
                isPaused,
                isRandomMode 
            };
            localStorage.setItem(`test_progress_${activeSessionId}`, JSON.stringify(progress));
        }

        function clearProgress() {
            localStorage.removeItem(`test_progress_${activeSessionId}`);
        }

        // Comprehensive background event handling
        function handleBackgroundChange() {
            if (!isSubmitting && !isPaused && !isReviewMode) {
                togglePause();
                saveProgress();
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) handleBackgroundChange();
        });
        window.addEventListener("blur", handleBackgroundChange);
        window.addEventListener("pagehide", handleBackgroundChange);

        if (isRetake && !isReviewMode) {
            document.getElementById('retake-badge').style.display = 'inline-block';
        }

        // --- BACK BUTTON INTERCEPTION --- //
        window.history.pushState({ page: 'test' }, null, window.location.href);

        window.addEventListener('popstate', function(event) {
            if (!isSubmitting && !isReviewMode) {
                saveProgress(); 
                
                let returnUrl = 'folder_view.html';
                if (sourceParam === 'course_content') { returnUrl = 'pfolder.html'; }
                
                if (folderKey) {
                    returnUrl += `?folder=${folderKey}`;
                    if (dbVersion === '2') { returnUrl += `&v=2`; }
                }
                
                window.location.replace(returnUrl);
            } else if (isReviewMode) {
                window.location.replace('analysiss.html');
            }
        });
        // -------------------------------- //

        auth.onAuthStateChanged(user => {
            if (!user) return window.location.href = 'dashboard.html';
            db.ref(`students/${user.uid}`).once('value', snap => {
                const userData = snap.val();
                if (userData) {
                    if(!isReviewMode) document.getElementById('user-display-name').innerText = userData.name.toUpperCase();
                    document.getElementById('user-initial').innerText = userData.name[0];
                }
            });

            if (isReviewMode) {
                setupReviewMode(parseInt(reviewIndexParam));
            } else {
                loadQuestions();
            }
        });

        // ---------------- REVIEW MODE LOGIC ---------------- //
        function setupReviewMode(index) {
            document.getElementById('app-loader').classList.add('fade-out');
            const data = JSON.parse(localStorage.getItem('agriq_last_result'));
            
            if (!data || !data.details || !data.details[index]) {
                return window.location.href = 'analysiss.html';
            }

            const qData = data.details[index];
            const opts = qData.options || [];

            document.getElementById('bottom-controls').style.display = 'none';
            document.getElementById('marker-grid').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('main-content').style.paddingBottom = '40px'; 
            
            const timerBadge = document.getElementById('q-timer');
            timerBadge.innerText = "REVIEW";
            timerBadge.style.background = "var(--primary-glow)";
            timerBadge.style.borderColor = "var(--primary)";
            
            document.getElementById('assessment-type-label').innerText = "REVIEW MODE";
            document.getElementById('assessment-type-label').style.color = "var(--primary)";
            document.getElementById('user-display-name').innerText = `Q${index + 1} OVERVIEW`;

            document.getElementById('q-number').innerHTML = `QUESTION <span style="color:var(--text-main);">${index + 1}</span>`;
            document.getElementById('q-display').innerHTML = qData.question;

            const optBox = document.getElementById('opts-display');
            optBox.innerHTML = '';
            
            if (opts.length === 0) {
                optBox.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-dim); font-size:14px; font-weight:700;">Option details are not available.<br>Please take a new test to see them.</div>';
            } else {
                opts.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'opt-box';
                    div.style.cursor = 'default';
                    div.innerText = opt;
                    
                    if (opt === qData.actual) {
                        div.style.borderColor = 'var(--success)';
                        div.style.background = 'var(--success-glow)';
                        div.style.color = 'var(--success)';
                        div.innerHTML += ' <i data-lucide="check-circle" size="18" style="float:right;"></i>';
                    } 
                    else if (opt === qData.user && qData.user !== qData.actual) {
                        div.style.borderColor = 'var(--danger)';
                        div.style.background = 'rgba(239, 68, 68, 0.05)';
                        div.style.color = 'var(--danger)';
                        div.innerHTML += ' <i data-lucide="x-circle" size="18" style="float:right;"></i>';
                    }
                    
                    optBox.appendChild(div);
                });
            }

            const backBtn = document.createElement('button');
            backBtn.className = 'btn-primary';
            backBtn.style.marginTop = '25px';
            backBtn.style.width = '100%';
            backBtn.innerHTML = '<i data-lucide="arrow-left" size="18"></i> BACK TO ANALYSIS';
            backBtn.onclick = () => window.location.href = 'analysiss.html';
            document.getElementById('main-content').appendChild(backBtn);
            
            lucide.createIcons();
        }

        // ---------------- NORMAL TEST LOGIC (UPGRADED WITH LOCAL STORAGE) ---------------- //
        async function loadQuestions() {
            if (!moduleKey) return window.location.href = 'courses.html';

            // 1. Check Revision Mode
            if (moduleKey === 'revision' || localStorage.getItem('isRevision') === 'true') {
                try {
                    const storedQs = localStorage.getItem('revisionQuestions');
                    if (storedQs) {
                        document.getElementById('assessment-type-label').innerText = "🔥 QUICK REVISION";
                        document.getElementById('assessment-type-label').style.color = "var(--warning)";
                        
                        const parsedQs = JSON.parse(storedQs);
                        localStorage.removeItem('isRevision');
                        localStorage.removeItem('revisionQuestions');

                        totalSecondsRemaining = parsedQs.length * 60;
                        setupQuestions(parsedQs);
                        return; 
                    } else {
                        return showModal("ERROR", "Revision data expired. Please restart from the folder.", "alert", () => window.location.href='courses.html');
                    }
                } catch(e) {
                    console.error("Revision Load Error:", e);
                }
            }

            // 2. CACHE-FIRST / OFFLINE LOCAL STORAGE CHECK
            // Checks the caches built by folder_view.html and pfolder.html
            if (folderKey) {
                const cachedFolderData = localStorage.getItem(`agriq_folder_data_${folderKey}`) || 
                                         localStorage.getItem(`agriq_pfolder_data_${folderKey}`);
                
                if (cachedFolderData) {
                    try {
                        const modulesArray = JSON.parse(cachedFolderData);
                        const targetModule = modulesArray.find(m => m.key === moduleKey || m.id === moduleKey);

                        if (targetModule && targetModule.questions) {
                            if (targetModule.current_session_id) {
                                activeSessionId = dbVersion === '2' ? targetModule.current_session_id + '_v2' : targetModule.current_session_id;
                            }

                            const rawQuestions = targetModule.questions?.data || targetModule.questions || [];
                            if (targetModule.config && targetModule.config.timeLimit) {
                                totalSecondsRemaining = parseInt(targetModule.config.timeLimit, 10);
                            }

                            document.getElementById('assessment-type-label').innerText = !navigator.onLine ? "⚡ OFFLINE ASSESSMENT" : "⚡ INSTANT CACHED TEST";
                            document.getElementById('assessment-type-label').style.color = "#10b981";
                            setupQuestions(rawQuestions);
                            return; // Zero Firebase reads used!
                        }
                    } catch(e) {
                        console.warn("Local storage cache parse failed, falling back to Firebase cloud:", e);
                    }
                }
            }

            // 3. Fallback: Check legacy 'agriq_offline_content'
            if (!navigator.onLine && folderKey && localStorage.getItem('agriq_offline_content')) {
                const offlineData = JSON.parse(localStorage.getItem('agriq_offline_content'));
                if (offlineData[folderKey] && offlineData[folderKey][moduleKey]) {
                    const data = offlineData[folderKey][moduleKey];
                    if (data.current_session_id) {
                        activeSessionId = dbVersion === '2' ? data.current_session_id + '_v2' : data.current_session_id;
                    }
                    const rawQuestions = data.questions?.data || data.questions || [];
                    if (data.config && data.config.timeLimit) {
                        totalSecondsRemaining = parseInt(data.config.timeLimit, 10);
                    }
                    document.getElementById('assessment-type-label').innerText = "OFFLINE ASSESSMENT";
                    document.getElementById('assessment-type-label').style.color = "#10b981";
                    setupQuestions(rawQuestions);
                    return; 
                }
            }

            // 4. Firebase Cloud Fetch (if not in local storage or if standalone subject)
            try {
                let dbPath = `subjects/${moduleKey}`;
                let snap = null;

                if (folderKey) {
                    if (dbVersion === '2') {
                        dbPath = `nested_subjects_v2/${folderKey}/${moduleKey}`;
                        snap = await db.ref(dbPath).once('value');
                        if (snap.exists()) document.getElementById('assessment-type-label').innerText = "LIVE ASSESSMENT V2";
                    } else if (sourceParam === 'course_content') {
                        dbPath = `course_content/${folderKey}/${moduleKey}`;
                        snap = await db.ref(dbPath).once('value');
                        if (snap.exists()) document.getElementById('assessment-type-label').innerText = "PREMIUM COURSE TEST";
                    } else if (sourceParam === 'nested_subjects') {
                        dbPath = `nested_subjects/${folderKey}/${moduleKey}`;
                        snap = await db.ref(dbPath).once('value');
                    } else {
                        // Try course_content first, then nested_subjects
                        dbPath = `course_content/${folderKey}/${moduleKey}`;
                        snap = await db.ref(dbPath).once('value');
                        if (snap.exists()) {
                            document.getElementById('assessment-type-label').innerText = "PREMIUM COURSE TEST";
                        } else {
                            dbPath = `nested_subjects/${folderKey}/${moduleKey}`;
                            snap = await db.ref(dbPath).once('value');
                        }
                    }
                } else {
                    snap = await db.ref(dbPath).once('value');
                }

                if (snap && snap.exists()) {
                    const data = snap.val();
                    if (data.current_session_id) {
                        activeSessionId = dbVersion === '2' ? data.current_session_id + '_v2' : data.current_session_id;
                    }
                    const rawQuestions = data.questions?.data || data.questions || [];
                    if (data.config && data.config.timeLimit) {
                        totalSecondsRemaining = parseInt(data.config.timeLimit, 10);
                    }
                    setupQuestions(rawQuestions);
                } else {
                    showModal("ERROR", "Module not found or not available.", "alert", () => window.location.href='courses.html');
                }
            } catch (e) { 
                console.error(e);
                showModal("ERROR", "Failed to load test. Please check connection.", "alert", () => window.location.href='courses.html');
            }
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function setupQuestions(dataArray) {
            if (!dataArray || dataArray.length === 0) {
                return showModal("EMPTY TEST", "There are no questions in this module.", "alert", () => window.location.href='courses.html');
            }

            // Check for saved progress FIRST
            const savedProgress = localStorage.getItem(`test_progress_${activeSessionId}`);
            let restoredQuestions = null;

            if (savedProgress) {
                try {
                    const parsed = JSON.parse(savedProgress);
                    userChoices = parsed.userChoices || {};
                    markedQuestions = parsed.markedQuestions || {};
                    currentIdx = parsed.currentIdx || 0;
                    if (parsed.totalSecondsRemaining && parsed.totalSecondsRemaining > 0) {
                        totalSecondsRemaining = parsed.totalSecondsRemaining;
                    }
                    if (parsed.questions && parsed.questions.length > 0) {
                        restoredQuestions = parsed.questions; 
                    }
                } catch(e) {
                    console.error("Could not restore saved progress.");
                }
            }

            if (restoredQuestions) {
                questions = restoredQuestions;
            } else {
                const processedQuestions = isRandomMode ? shuffleArray([...dataArray]) : [...dataArray];
                questions = processedQuestions.map(q => {
                    const opts = q.options || [];
                    const finalOptions = isRandomMode ? shuffleArray([...opts]) : [...opts];
                    return {
                        ...q,
                        displayQ: q.question || q.q,
                        correct: q.answer || q.ans,
                        shuffledOpts: finalOptions
                    };
                });
            }

            initUI();
            document.getElementById('app-loader').classList.add('fade-out');
            startGlobalTimer();
        }

        function initUI() {
            const grid = document.getElementById('marker-grid');
            grid.innerHTML = '';
            document.getElementById('q-total-count').innerText = questions.length;

            questions.forEach((_, i) => {
                const p = document.createElement('div');
                p.className = 'q-pill';
                p.id = `mark-${i}`;
                p.innerText = i + 1;
                p.onclick = () => { currentIdx = i; showQ(); };
                grid.appendChild(p);
            });
            showQ();
        }

        function toggleMark() {
            markedQuestions[currentIdx] = !markedQuestions[currentIdx];
            saveProgress();
            showQ();
        }

        function togglePause() {
            if (isReviewMode) return;
            isPaused = !isPaused;
            const overlay = document.getElementById('pause-overlay');
            if (isPaused) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
            saveProgress();
        }

        function showQ() {
            const q = questions[currentIdx];
            
            document.getElementById('q-current-count').innerText = currentIdx + 1;
            document.getElementById('q-display').innerHTML = `<span style="color: var(--primary); font-weight: 800;">Q.${currentIdx + 1}</span> ${q.displayQ}`;
            
            document.querySelectorAll('.q-pill').forEach((p, i) => {
                p.classList.remove('active', 'done', 'marked');
                if (markedQuestions[i]) {
                    p.classList.add('marked');
                } else if (userChoices[i] !== undefined && userChoices[i] !== null) {
                    p.classList.add('done');
                }
                if (i === currentIdx) {
                    p.classList.add('active');
                }
            });

            const markBtn = document.getElementById('mark-btn');
            if (markedQuestions[currentIdx]) {
                markBtn.style.background = 'var(--warning)';
                markBtn.style.color = '#fff';
                markBtn.innerHTML = 'MARKED <i data-lucide="bookmark-check" size="18"></i>';
            } else {
                markBtn.style.background = '#fff';
                markBtn.style.color = 'var(--warning)';
                markBtn.innerHTML = 'MARK <i data-lucide="bookmark" size="18"></i>';
            }

            const optBox = document.getElementById('opts-display');
            optBox.innerHTML = '';
            q.shuffledOpts.forEach(opt => {
                const div = document.createElement('div');
                div.className = `opt-box ${userChoices[currentIdx] === opt ? 'selected' : ''}`;
                div.innerText = opt;
                div.onclick = () => { 
                    if (userChoices[currentIdx] === opt) {
                        userChoices[currentIdx] = null; 
                    } else {
                        userChoices[currentIdx] = opt; 
                    }
                    saveProgress();
                    showQ(); 
                };
                optBox.appendChild(div);
            });
            
            document.getElementById(`mark-${currentIdx}`).scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            lucide.createIcons(); 
        }

        function updateTimerUI() {
            let m = Math.floor(totalSecondsRemaining / 60).toString().padStart(2, '0');
            let s = (totalSecondsRemaining % 60).toString().padStart(2, '0');
            document.getElementById('q-timer').innerText = `${m}:${s}`;
        }

        function startGlobalTimer() {
            updateTimerUI(); 
            timer = setInterval(() => {
                if (isPaused) return; 
                if (totalSecondsRemaining <= 0) { 
                    clearInterval(timer); 
                    processFinalResults(); 
                } else {
                    totalSecondsRemaining--;
                    updateTimerUI();
                    if (totalSecondsRemaining % 5 === 0) saveProgress();
                }
            }, 1000);
        }

        function changeQ(dir) {
            let next = currentIdx + dir;
            if (next >= 0 && next < questions.length) { 
                currentIdx = next; 
                saveProgress();
                showQ(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function submitTest() { 
            let msg = "Do you want to end this session?";
            if (isRetake) {
                msg += "<br><br><span style='color:var(--text-dim); font-size:12px;'>You will earn full XP for this retake.</span>";
            }
            showModal("SUBMIT", msg, "confirm", processFinalResults); 
        }

        async function processFinalResults() {
            if(isSubmitting) return;
            isSubmitting = true;
            clearInterval(timer);
            clearProgress(); // Clear saved progress upon successful submission

            let correctCount = 0;
            const details = questions.map((q, i) => {
                const userAns = (userChoices[i] === null || userChoices[i] === undefined) ? "SKIPPED" : userChoices[i];
                const isCorrect = userAns === q.correct;
                if(isCorrect) correctCount++;
                return { 
                    question: q.displayQ, 
                    user: userAns, 
                    actual: q.correct,
                    options: q.shuffledOpts 
                };
            });

            let earnedXP = correctCount;

            const resultData = { 
                uid: auth.currentUser.uid,
                score: earnedXP, 
                rawScore: correctCount, 
                total: questions.length, 
                accuracy: Math.round((correctCount / (questions.length || 1)) * 100),
                module: moduleKey, 
                session_id: activeSessionId, 
                timestamp: Date.now(),
                isRetake: isRetake
            };

            // 1. Save locally for analysis.html
            localStorage.setItem('agriq_last_result', JSON.stringify({ ...resultData, details }));

            // 2. INSTANT SCORE CACHE SYNC: Update local user score cache so folder views show new scores instantly
            const cacheKeyScores = `agriq_user_scores_${auth.currentUser.uid}`;
            try {
                const cachedScoresStr = localStorage.getItem(cacheKeyScores);
                const cachedScores = cachedScoresStr ? JSON.parse(cachedScoresStr) : {};
                cachedScores[activeSessionId] = { score: earnedXP, timestamp: Date.now() };
                localStorage.setItem(cacheKeyScores, JSON.stringify(cachedScores));
            } catch(err) {
                console.warn("Could not update local score cache:", err);
            }

            // 3. If Offline: Skip await and let Firebase queue it in the background
            if (!navigator.onLine) {
                db.ref('leaderboard').push(resultData);
                const userRef = db.ref(`students/${auth.currentUser.uid}`);
                userRef.child(`results/${activeSessionId}`).set({ score: earnedXP, timestamp: Date.now() });
                window.location.replace('analysiss.html');
                return;
            }

            try {
                await db.ref('leaderboard').push(resultData);
                const userRef = db.ref(`students/${auth.currentUser.uid}`);
                const snap = await userRef.once('value');
                const d = snap.val() || {};
                const newTests = (d.testsTaken || 0) + 1;
                
                await userRef.update({
                    totalScore: (d.totalScore || 0) + earnedXP,
                    testsTaken: newTests,
                    avgAccuracy: Math.round(((d.avgAccuracy || 0) * (newTests - 1) + resultData.accuracy) / newTests)
                });

                await userRef.child(`results/${activeSessionId}`).set({
                    score: earnedXP,
                    timestamp: Date.now()
                });

                window.location.replace('analysiss.html');
            } catch (e) {
                window.location.replace('analysiss.html');
            }
        }

        function showModal(title, text, type, onConfirm) {
            const m = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerHTML = text;
            m.style.display = 'flex';
            document.getElementById('modal-confirm-btn').onclick = () => { m.style.display='none'; if(onConfirm) onConfirm(); };
            document.getElementById('modal-cancel-btn').onclick = () => m.style.display='none';
            if(type === 'alert') document.getElementById('modal-cancel-btn').classList.add('hidden');
        }

        lucide.createIcons();
    </script>
</body>
</html>
