<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login | AgriQ Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --primary-glow: rgba(0, 114, 255, 0.25);
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.7);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(226, 232, 240, 0.6);
            --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg); margin: 0; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px 20px; position: relative; color: var(--text-main);
            overflow-x: hidden; /* Allows vertical scrolling but prevents horizontal breaking */
        }

        /* Ambient Background Mesh (V7.0) */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(0, 198, 255, 0.1), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.1), transparent 25%);
            animation: breathe 10s ease-in-out infinite alternate;
        }
        @keyframes breathe { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        /* --- Fast Global Loader --- */
        #global-loader {
            position: fixed; inset: 0; background: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
        }
        .loader-brand {
            font-weight: 900; font-size: 28px; letter-spacing: -1px; margin-bottom: 20px;
            color: var(--text-main);
        }
        .loader-brand span { 
            background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            font-family: 'JetBrains Mono'; 
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--primary-glow);
            border-top-color: #0072ff; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Snappy Card Fade In --- */
        .fade-in { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(30px); }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* Glassmorphism Card V7.0 */
        .auth-card { 
            background: var(--surface); border: 1px solid var(--border);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            width: 100%; max-width: 420px; padding: 40px 35px; 
            border-radius: 32px; text-align: center; position: relative; z-index: 10;
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
            z-index: 0; pointer-events: none; border-radius: 32px;
        }
        .auth-card > * { position: relative; z-index: 1; }

        .brand { font-weight: 900; font-size: 26px; letter-spacing: -1px; margin-bottom: 8px; }
        .brand span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'JetBrains Mono'; }
        
        /* Quote / Description */
        .app-desc {
            font-size: 14px; color: var(--text-dim); font-weight: 500; 
            line-height: 1.6; margin: 0 auto 30px auto; padding: 0 10px;
        }
        .quote {
            font-style: italic; font-weight: 700; color: #0072ff; margin-bottom: 8px; display: block;
        }

        .form-title { margin: 0 0 20px; font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }

        /* Inputs */
        .input-group { position: relative; margin-bottom: 16px; text-align: left; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #0072ff; }
        input { 
            width: 100%; padding: 16px 16px 16px 52px; border-radius: 16px; 
            border: 2px solid var(--border); background: #f8fafc; 
            font-weight: 600; outline: none; transition: var(--transition);
            color: var(--text-main); font-size: 15px;
        }
        input::placeholder { color: var(--text-dim); font-weight: 500; }
        input:focus { border-color: #0072ff; background: #fff; box-shadow: 0 5px 15px var(--primary-glow); }

        /* Buttons */
        .btn-primary { 
            width: 100%; padding: 18px; border-radius: 16px; border: none; 
            background: var(--primary-gradient); color: #fff; font-weight: 900; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 10px 25px var(--primary-glow); transition: var(--transition); margin-top: 10px;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0, 114, 255, 0.4); }
        .btn-primary:active { transform: scale(0.97); }

        .btn-google {
            width: 100%; padding: 15px; border-radius: 16px; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-weight: 800; cursor: pointer; background: rgba(255, 255, 255, 0.8); 
            margin-top: 15px; font-size: 14px; color: var(--text-main); transition: var(--transition);
        }
        .btn-google:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.04); border-color: #0072ff;}

        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .divider span { color: var(--text-dim); font-size: 12px; font-weight: 700; }

        /* Black Toggle Button */
        .btn-black {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: #0f172a; color: #ffffff; font-weight: 800; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: var(--transition); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
        }
        .btn-black:hover { background: #1e293b; transform: translateY(-2px); box-shadow: 0 12px 25px rgba(15, 23, 42, 0.25); }
        .btn-black:active { transform: scale(0.97); }

        #toast { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: white; padding: 14px 24px; border-radius: 50px;
            font-size: 13px; font-weight: 700; display: none; z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: slideUpFade 0.3s ease;
        }

        /* Copyright Footer */
        .copyright {
            margin-top: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            text-align: center;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div id="global-loader">
        <div class="loader-brand">AGRI<span>Q</span> PRO</div>
        <div class="spinner"></div>
    </div>

    <div id="toast">Message here</div>

    <div class="auth-card fade-in">
        <div class="brand">AGRI<span>Q</span> PRO</div>
        
        <div class="app-desc">
            <span class="quote">"Discipline is the seed. Success is the crop."</span>
            Sign in to access your daily drills, encrypted exam arrays, and live leaderboards.
        </div>

        <h2 id="auth-title" class="form-title">Welcome Back</h2>
        
        <form onsubmit="handleAuth(event)">
            <div class="input-group">
                <i data-lucide="mail" size="18"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <i data-lucide="lock" size="18"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">SIGN IN <i data-lucide="arrow-right" size="18"></i></button>
        </form>

        <button class="btn-google" onclick="googleLogin()">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18"> Continue with Google
        </button>

        <div class="divider"><span>OR</span></div>

        <button type="button" class="btn-black" onclick="toggleMode()" id="toggle-btn">
            CREATE AN ACCOUNT <i data-lucide="user-plus" size="16"></i>
        </button>
    </div>

    <div class="copyright fade-in" style="animation-delay: 0.1s;">
        © 2026 AgriQ VNC Corporation. All rights reserved.
    </div>

    <script>
        // --- Firebase Init ---
        const firebaseConfig = {
            apiKey: "AIzaSyBFYdQZI4NXaqtWd4rEz3yL-0nw6PJqG6I",
            authDomain: "agri-mcar.firebaseapp.com",
            databaseURL: "https://agri-mcar-default-rtdb.firebaseio.com",
            projectId: "agri-mcar"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let isLogin = true;

        lucide.createIcons();

        // --- Auth Logic ---
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            try {
                const loader = document.getElementById('global-loader');
                loader.style.display = 'flex';
                // Force reflow
                loader.offsetHeight; 
                loader.style.opacity = '1';
                loader.style.visibility = 'visible';

                if(isLogin) {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    await auth.createUserWithEmailAndPassword(email, pass);
                }
                window.location.href = 'dashboard.html'; 
            } catch (err) {
                const loader = document.getElementById('global-loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.visibility = 'hidden';
                    loader.style.display = 'none';
                }, 300);
                showToast(err.message);
            }
        }

        async function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const loader = document.getElementById('global-loader');
                loader.style.display = 'flex';
                loader.offsetHeight; 
                loader.style.opacity = '1';
                loader.style.visibility = 'visible';

                await auth.signInWithPopup(provider);
                window.location.href = 'dashboard.html';
            } catch (err) {
                const loader = document.getElementById('global-loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.visibility = 'hidden';
                    loader.style.display = 'none';
                }, 300);
                showToast(err.message);
            }
        }

        function toggleMode() {
            isLogin = !isLogin;
            
            // Update Form Elements
            document.getElementById('auth-title').innerText = isLogin ? "Welcome Back" : "Create Account";
            document.getElementById('submit-btn').innerHTML = isLogin ? 'SIGN IN <i data-lucide="arrow-right" size="18"></i>' : 'REGISTER <i data-lucide="arrow-right" size="18"></i>';
            
            // Update Toggle Button
            document.getElementById('toggle-btn').innerHTML = isLogin ? 'CREATE AN ACCOUNT <i data-lucide="user-plus" size="16"></i>' : 'BACK TO LOGIN <i data-lucide="log-in" size="16"></i>';
            
            lucide.createIcons();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // --- Snappy Preloader Reveal ---
        auth.onAuthStateChanged(user => { 
            if(user) {
                window.location.href = 'dashboard.html'; 
            } else {
                const loader = document.getElementById('global-loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.visibility = 'hidden';
                    loader.style.display = 'none';
                }, 300); 
            }
        });
    </script>
</body>
</html>
