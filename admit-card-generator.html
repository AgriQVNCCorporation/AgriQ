<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AgriQ Pro | Request Admit Card</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --primary-glow: rgba(0, 114, 255, 0.25);
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.7);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(226, 232, 240, 0.6);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { 
            background-color: var(--bg); margin: 0; color: var(--text-main); 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Background Mesh */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(0, 198, 255, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
            animation: breathe 10s ease-in-out infinite alternate;
        }
        @keyframes breathe { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        /* --- HEADER --- */
        header { 
            width: 100%; padding: 15px 24px; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--border); box-shadow: 0 4px 30px rgba(0,0,0,0.03);
        }
        .brand { font-weight: 900; font-size: 22px; letter-spacing: -1px; display: flex; align-items: center; gap: 8px;}
        .brand span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'JetBrains Mono'; }
        
        .back-btn { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            color: var(--text-main); cursor: pointer; transition: var(--transition);
        }
        .back-btn:hover { background: #fff; border-color: var(--primary); color: var(--primary); }

        main { width: 100%; max-width: 800px; padding: 30px 20px; flex: 1; display: flex; flex-direction: column; gap: 24px; position: relative; z-index: 1;}

        /* --- GLASS PANEL --- */
        .glass-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 32px; padding: 35px; color: inherit;
            position: relative; overflow: hidden;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }
        .glass-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
            z-index: 0; pointer-events: none;
        }
        .glass-panel > * { position: relative; z-index: 1; }

        .panel-header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .panel-header h3 { margin: 0 0 8px 0; font-size: 22px; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px;}
        .panel-header p { margin: 0; font-size: 14px; color: var(--text-dim); line-height: 1.6; font-weight: 500;}

        /* --- FORM GRID --- */
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }

        .input-group { display: flex; flex-direction: column; gap: 8px; position: relative;}
        .input-group.full-width { grid-column: 1 / -1; }

        .input-group label { font-size: 12px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; padding-left: 4px; }
        .input-group i { position: absolute; left: 16px; top: 40px; color: var(--primary); opacity: 0.7;}

        .glass-input {
            width: 100%; padding: 16px 16px 16px 48px; border-radius: 16px; 
            border: 2px solid var(--border); background: #f8fafc; font-weight: 600; 
            font-size: 14px; color: var(--text-main); transition: var(--transition); outline: none;
            -webkit-appearance: none; appearance: none;
        }
        .glass-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 5px 15px var(--primary-glow); }
        .glass-input::placeholder { color: #94a3b8; font-weight: 500;}

        /* Photo Upload UI */
        .upload-zone {
            padding: 30px; background: rgba(0, 114, 255, 0.03); border: 2px dashed rgba(0, 114, 255, 0.3);
            text-align: center; cursor: pointer; border-radius: 20px; transition: var(--transition);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        }
        .upload-zone:hover { background: rgba(0, 114, 255, 0.08); border-color: var(--primary); }
        .upload-zone.has-image { padding: 10px; border-style: solid; background: #fff;}
        .upload-preview { width: auto; height: 150px; border-radius: 12px; display: none; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.1);}

        /* Privacy Policy Checkbox */
        .privacy-box {
            background: rgba(245, 158, 11, 0.05); border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 20px; border-radius: 20px; margin-top: 10px; display: flex; gap: 15px; align-items: flex-start;
            cursor: pointer; transition: var(--transition);
        }
        .privacy-box:hover { background: rgba(245, 158, 11, 0.1); }
        .privacy-box input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: var(--warning); cursor: pointer; margin-top: 2px;
        }
        .privacy-text { font-size: 13px; color: var(--text-dim); line-height: 1.5; font-weight: 500; margin: 0;}
        .privacy-text strong { color: var(--text-main); font-weight: 800;}

        /* Primary Button */
        .btn-primary { 
            width: 100%; padding: 18px; border-radius: 16px; border: none; 
            background: var(--primary-gradient); color: white; font-weight: 900; font-size: 15px; 
            margin-top: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            gap: 10px; box-shadow: 0 10px 25px var(--primary-glow); transition: var(--transition); 
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0, 114, 255, 0.4); }
        .btn-primary:active { transform: scale(0.97); }

        /* --- MODALS --- */
        #modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 24px; }
        .modal { background: white; padding: 35px; border-radius: 32px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .modal-icon { width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .modal-icon.success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .modal-icon.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        
        .modal-btn { padding: 16px 24px; border-radius: 16px; border: none; font-weight: 800; cursor: pointer; width: 100%; transition: var(--transition); font-size: 14px;}
        .modal-btn.confirm { background: var(--primary-gradient); color: white; box-shadow: 0 8px 20px var(--primary-glow);}
        .modal-btn.error-btn { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .modal-btn:active { transform: scale(0.95); }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader inside button */
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <header>
        <div class="back-btn" onclick="window.location.href='dashboard.html'"><i data-lucide="chevron-left" size="20"></i></div>
        <div class="brand"><i data-lucide="shield-check" size="24" color="var(--primary)"></i> AgriQ <span>PRO</span></div>
        <div style="width: 40px;"></div> <!-- Spacer -->
    </header>

    <!-- Custom Modal -->
    <div id="modal-overlay">
        <div class="modal" id="modal-content">
            <!-- Injected via JS -->
        </div>
    </div>

    <main>
        <div class="glass-panel">
            <div class="panel-header">
                <h3><i data-lucide="file-signature" size="24" color="var(--primary)"></i> Admit Card Request</h3>
                <p>Submit your details to generate your official Sunday Grand Test Application ID. Requires Admin approval.</p>
            </div>

            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Full Name</label>
                    <i data-lucide="user" size="18"></i>
                    <input type="text" class="glass-input" id="fullName" placeholder="As per official records">
                </div>
                <div class="input-group">
                    <label>Mother's Name</label>
                    <i data-lucide="users" size="18"></i>
                    <input type="text" class="glass-input" id="motherName" placeholder="Mother's Name">
                </div>
                <div class="input-group">
                    <label>Father's Name</label>
                    <i data-lucide="users" size="18"></i>
                    <input type="text" class="glass-input" id="fatherName" placeholder="Father's Name">
                </div>
                <div class="input-group">
                    <label>Date of Birth (Password)</label>
                    <i data-lucide="calendar" size="18"></i>
                    <input type="date" class="glass-input" id="dob" style="padding-left: 48px;">
                </div>
                <div class="input-group">
                    <label>Gender</label>
                    <i data-lucide="user-square" size="18"></i>
                    <select class="glass-input" id="gender">
                        <option value="" disabled selected>Select Gender</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <i data-lucide="tag" size="18"></i>
                    <select class="glass-input" id="category">
                        <option value="" disabled selected>Select Category</option>
                        <option value="OPEN">OPEN</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="EWS">EWS</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>District</label>
                    <i data-lucide="map-pin" size="18"></i>
                    <select class="glass-input" id="district">
                        <option value="JALNA" selected>Jalna</option>
                        <option value="PUNE">Pune</option>
                        <option value="AKOLA">Akola</option>
                        <option value="PARBHANI">Parbhani</option>
                        <option value="DAPOLI">Dapoli</option>
                        <option value="NAGPUR">Nagpur</option>
                        <option value="LATUR">Latur</option>
                        <option value="KOLHAPUR">Kolhapur</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <i data-lucide="phone" size="18"></i>
                    <input type="number" class="glass-input" id="mobile" placeholder="10-digit number">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <i data-lucide="mail" size="18"></i>
                    <input type="email" class="glass-input" id="email" placeholder="student@example.com">
                </div>
                
                <div class="input-group full-width">
                    <label>Candidate Photo (Passport Size)</label>
                    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('photo').click()">
                        <i data-lucide="image-plus" size="32" color="var(--primary)" id="upload-icon"></i>
                        <span style="font-weight: 700; font-size: 14px; color: var(--primary);" id="upload-text">Click to upload photo</span>
                        <img id="photo-preview" class="upload-preview">
                        <input type="file" id="photo" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
                    </div>
                </div>
            </div>

            <!-- Privacy Policy & Declaration -->
            <label class="privacy-box">
                <input type="checkbox" id="declaration">
                <p class="privacy-text">
                    <strong>Declaration:</strong> I hereby declare that all the information provided above is true and correct to the best of my knowledge. I understand that any false information may lead to the cancellation of my application and termination of my Sunday Grand Test access.
                </p>
            </label>
            
            <button class="btn-primary" id="submit-btn" onclick="submitApplication()">
                SUBMIT APPLICATION <i data-lucide="send" size="18"></i>
            </button>
        </div>
    </main>

    <script>
        // --- Firebase Init ---
        const firebaseConfig = {
            apiKey: "AIzaSyBFYdQZI4NXaqtWd4rEz3yL-0nw6PJqG6I",
            authDomain: "agri-mcar.firebaseapp.com",
            databaseURL: "https://agri-mcar-default-rtdb.firebaseio.com",
            projectId: "agri-mcar"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let uploadedPhotoBase64 = null;
        let currentUserUid = null;

        lucide.createIcons();

        // Auth Check
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserUid = user.uid;
                // Auto-fill email if available
                if(user.email) document.getElementById('email').value = user.email;
            } else {
                window.location.href = "login.html";
            }
        });

        // --- Photo Handling ---
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // Resize/compress image to save DB space
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Passport ratio 3:4 target
                        canvas.width = 300; canvas.height = 400; 

                        const aspect = img.width / img.height;
                        let sx = 0, sy = 0, sw = img.width, sh = img.height;

                        if (aspect > 0.75) { 
                            sw = img.height * 0.75; sx = (img.width - sw) / 2;
                        } else { 
                            sh = img.width / 0.75; sy = (img.height - sh) / 2;
                        }

                        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 300, 400);
                        uploadedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);

                        // Update UI
                        const preview = document.getElementById('photo-preview');
                        const zone = document.getElementById('upload-zone');
                        document.getElementById('upload-icon').style.display = 'none';
                        document.getElementById('upload-text').style.display = 'none';
                        preview.src = uploadedPhotoBase64;
                        preview.style.display = 'block';
                        zone.classList.add('has-image');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // --- Modals ---
        function showModal(type, title, text) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            if(type === 'error') {
                content.innerHTML = `
                    <div class="modal-icon error"><i data-lucide="alert-triangle" size="32"></i></div>
                    <h3 style="margin:0 0 12px; font-size:22px; font-weight:900;">${title}</h3>
                    <p style="color:var(--text-dim); font-size:14px; font-weight:500; line-height:1.6; margin-bottom:24px;">${text}</p>
                    <button class="modal-btn error-btn" onclick="closeModal()">Review Form</button>
                `;
            } else if (type === 'success') {
                content.innerHTML = `
                    <div class="modal-icon success"><i data-lucide="clock" size="32"></i></div>
                    <h3 style="margin:0 0 12px; font-size:22px; font-weight:900;">${title}</h3>
                    <p style="color:var(--text-dim); font-size:14px; font-weight:500; line-height:1.6; margin-bottom:24px;">${text}</p>
                    <div style="background: rgba(245, 158, 11, 0.05); border: 1px solid rgba(245, 158, 11, 0.2); padding: 12px; border-radius: 12px; margin-bottom: 24px;">
                        <p style="color:var(--warning); font-size:12px; font-weight:700; margin:0;">Your Test Code will be securely unlocked on your Profile page once an Admin verifies your identity and course purchase.</p>
                    </div>
                    <button class="modal-btn confirm" onclick="window.location.href='dashboard.html'">Return to Dashboard</button>
                `;
            }
            overlay.style.display = 'flex';
            lucide.createIcons();
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        // --- Form Submission Logic ---
        function submitApplication() {
            const btn = document.getElementById('submit-btn');
            
            // 1. Validate Form
            const requiredFields = ['fullName', 'motherName', 'fatherName', 'dob', 'gender', 'category', 'district', 'mobile', 'email'];
            let isFormComplete = true;

            for(let id of requiredFields) {
                if(!document.getElementById(id).value.trim()) {
                    isFormComplete = false; break;
                }
            }

            if (!isFormComplete || !uploadedPhotoBase64) {
                return showModal('error', 'Incomplete Details', 'Please fill in ALL fields and upload a Candidate Photo before submitting.');
            }

            if (!document.getElementById('declaration').checked) {
                return showModal('error', 'Declaration Required', 'You must accept the privacy declaration to submit your application.');
            }

            // 2. Loading State
            btn.innerHTML = `<i data-lucide="loader-2" class="spin" size="20"></i> PROCESSING...`;
            btn.style.pointerEvents = 'none';
            lucide.createIcons();

            // 3. Generate Random 8-Digit App ID
            // The code is generated and saved to the database, but NEVER output to the screen
            const generatedAppId = Math.floor(10000000 + Math.random() * 90000000);
            const formattedAppId = `AQ-${generatedAppId}`;

            // 4. Create Payload
            const payload = {
                appId: formattedAppId, // Securely saved in DB
                status: 'pending',
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                fullName: document.getElementById('fullName').value.trim(),
                motherName: document.getElementById('motherName').value.trim(),
                fatherName: document.getElementById('fatherName').value.trim(),
                dob: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
                category: document.getElementById('category').value,
                district: document.getElementById('district').value,
                mobile: document.getElementById('mobile').value.trim(),
                email: document.getElementById('email').value.trim(),
                photoBase64: uploadedPhotoBase64 
            };

            // 5. Push to Firebase
            db.ref(`admit_card_requests/${currentUserUid}`).set(payload)
                .then(() => {
                    btn.innerHTML = `SUBMIT APPLICATION <i data-lucide="send" size="18"></i>`;
                    btn.style.pointerEvents = 'auto';
                    
                    // Code is intentionally omitted from the success message
                    showModal('success', 'Application Submitted!', 'Your request has been securely forwarded to the administration for review.');
                })
                .catch((error) => {
                    btn.innerHTML = `SUBMIT APPLICATION <i data-lucide="send" size="18"></i>`;
                    btn.style.pointerEvents = 'auto';
                    lucide.createIcons();
                    showModal('error', 'Database Error', 'Failed to submit application: ' + error.message);
                });
        }
    </script>
</body>
</html>
