<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AgriQ Pro | Premium Test Generator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <!-- Modern Native DOCX Library -->
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>

    <style>
        :root {
            --brand-gold: #D4AF37;      
            --brand-green-light: #4ade80;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        @keyframes ambientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(-45deg, #051024, #0a2254, #12351f, #071510);
            background-size: 400% 400%;
            animation: ambientBG 18s ease infinite;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-attachment: fixed;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.5;
            animation: ambientBG 10s ease-in-out infinite alternate;
        }
        body::before {
            width: 300px; height: 300px;
            background: rgba(30, 86, 49, 0.6);
            top: -50px; left: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: rgba(10, 34, 84, 0.6);
            bottom: -100px; right: -100px;
        }

        header {
            width: 100%;
            padding: calc(env(safe-area-inset-top) + 16px) 24px 16px;
            background: rgba(10, 15, 30, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--glass-shadow);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
        }

        .logo-svg {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }

        .brand-title {
            font-weight: 800;
            font-size: 26px;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .brand-title span {
            color: var(--brand-gold);
        }

        .brand-subtitle {
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--brand-green-light);
            text-transform: uppercase;
        }

        main {
            width: 100%;
            max-width: 600px;
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }

        .coaching-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .coaching-badge span {
            color: var(--brand-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .glass-card h3 {
            margin: 0 0 20px 0;
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .input-wrapper label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 4px;
        }

        .text-input, textarea {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .text-input::placeholder, textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }
        
        textarea {
            height: 180px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            resize: none;
            line-height: 1.5;
        }

        .text-input:focus, textarea:focus {
            outline: none;
            border-color: var(--brand-gold);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3), 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }

        .btn-action {
            border: none;
            padding: 20px;
            font-size: 15px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 800;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-shuffle {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }
        
        .btn-shuffle:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.4);
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--brand-gold), #B5952F);
            color: #000000;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(212, 175, 55, 0.4);
        }

        /* Glass Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: 0.4s ease;
            padding: 20px;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        
        .modal-card {
            background: rgba(20, 25, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%; max-width: 380px;
            border-radius: 28px; padding: 32px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(30px) scale(0.95);
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }
        .modal-overlay.show .modal-card { transform: translateY(0) scale(1); }
        
        .modal-icon {
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 38px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-icon.success { box-shadow: 0 0 30px rgba(74, 222, 128, 0.2); }
        .modal-icon.error { box-shadow: 0 0 30px rgba(239, 68, 68, 0.2); }
        
        .modal-card h3 { margin: 0 0 12px 0; font-size: 24px; color: #ffffff; font-weight: 800; }
        .modal-card p { margin: 0 0 28px 0; font-size: 15px; color: var(--text-dim); line-height: 1.6; }
        
        .btn-confirm { 
            background: #ffffff; 
            color: #000000; 
            width: 100%; 
            padding: 18px; 
            border-radius: 16px; 
            border: none;
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <div id="modalIcon" class="modal-icon success">✨</div>
            <h3 id="modalTitle">Success!</h3>
            <p id="modalText">Message</p>
            <button id="modalBtnConfirm" class="btn-confirm">Continue</button>
        </div>
    </div>

    <header>
        <div class="brand-container">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,0.05)" stroke="#D4AF37" stroke-width="4"/>
                <path d="M50 20 C 75 20, 80 45, 80 60 C 80 85, 50 90, 50 90 C 50 90, 20 85, 20 60 C 20 45, 25 20, 50 20 Z" fill="url(#grad1)"/>
                <path d="M50 90 V 40" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
                <path d="M50 75 Q 40 65 35 55" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
                <path d="M50 60 Q 60 50 65 40" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#1E5631;stop-opacity:0.8" />
                    </linearGradient>
                </defs>
            </svg>
            <div class="brand-text">
                <span class="brand-title">AGRIQ <span>PRO</span></span>
                <span class="brand-subtitle">Premium Test Generator</span>
            </div>
        </div>
    </header>

    <main>
        <div class="glass-card coaching-badge">
            🌟 Offline Format Tool <span>MCAER • ICAR • MPSC</span>
        </div>

        <div class="glass-card">
            <h3>⚙️ Test Configuration</h3>
            <div class="input-wrapper">
                <label for="testTitle">Test Title Header</label>
                <input type="text" id="testTitle" class="text-input" placeholder="e.g. ENTO MOCK TEST NO. 01">
            </div>
        </div>

        <div class="glass-card">
            <h3>📝 Question Bank Data</h3>
            <div class="input-wrapper">
                <label for="jsonInput">Paste JSON Array Format Here</label>
                <textarea id="jsonInput" placeholder='[&#10;  {&#10;    "question": "The term Ecology was first coined by?",&#10;    "options": ["Charles Darwin", "Ernst Haeckel", "William Kirby", "Linnaeus"],&#10;    "answer": "Ernst Haeckel"&#10;  }&#10;]'></textarea>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn-action btn-shuffle" onclick="handleShuffleClick()">
                🔀 Shuffle Questions & Options
            </button>
            <button class="btn-action btn-generate" id="downloadBtn" onclick="handleDownloadWord()">
                📄 Generate & Download DOCX
            </button>
        </div>
    </main>

    <script>
        function showModal(title, text, iconType, iconEmoji) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            
            const mIcon = document.getElementById('modalIcon');
            mIcon.innerText = iconEmoji;
            mIcon.className = `modal-icon ${iconType}`;
            
            document.getElementById('modalBtnConfirm').onclick = () => modal.classList.remove('show');
            modal.classList.add('show');
        }

        function handleShuffleClick() {
            const jsonText = document.getElementById('jsonInput').value;
            if (!jsonText.trim()) return showModal('Empty Input', 'Please paste your JSON data first.', 'error', '⚠️');
            
            try {
                let data = JSON.parse(jsonText);
                if (!Array.isArray(data)) throw new Error("Input must be a valid array.");
                
                for (let i = data.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [data[i], data[j]] = [data[j], data[i]];
                }
                data.forEach(item => {
                    if (item.options && Array.isArray(item.options)) {
                        for (let i = item.options.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [item.options[i], item.options[j]] = [item.options[j], item.options[i]];
                        }
                    }
                });
                document.getElementById('jsonInput').value = JSON.stringify(data, null, 2);
                showModal('Shuffle Successful!', 'Questions and Options randomized.', 'success', '✨');
            } catch (error) {
                showModal('Invalid JSON', 'Syntax Error: ' + error.message, 'error', '❌');
            }
        }

        async function handleDownloadWord() {
            const jsonText = document.getElementById('jsonInput').value;
            const testTitle = document.getElementById('testTitle').value.trim() || 'MOCK TEST';
            const btn = document.getElementById('downloadBtn');

            if (!jsonText.trim()) return showModal('Empty Input', 'Please paste your JSON data first.', 'error', '⚠️');

            let data;
            try {
                data = JSON.parse(jsonText);
                if (!Array.isArray(data)) throw new Error("Must be an array.");
            } catch (error) {
                return showModal('Invalid JSON', 'Check syntax.', 'error', '❌');
            }

            let fileName = prompt("Enter a name for your Word document:", testTitle.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "_") || "AgriQ_Pro_Document");
            if (!fileName) return;

            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '⏳ Generating Native DOCX...';
            btn.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 50));

            try {
                const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, HeadingLevel } = docx;

                const childrenItems = [];

                // Add Title Heading with Georgia Font formatting
                childrenItems.push(new Paragraph({
                    children: [
                        new TextRun({
                            text: testTitle,
                            font: "Georgia",
                            size: 32, // 16pt (half-points)
                            bold: true
                        })
                    ],
                    alignment: AlignmentType.CENTER,
                    spacing: { after: 400 }
                }));

                const optLabels = ["A", "B", "C", "D"];

                data.forEach(item => {
                    let ansIdx = "";
                    if (item.options && item.answer) {
                        let found = item.options.indexOf(item.answer);
                        if (found !== -1) ansIdx = (found + 1).toString();
                    }

                    // Helper to create cells enforcing 3.1 cm column width and Georgia 11pt font
                    const createRow = (label, value) => {
                        return new TableRow({
                            children: [
                                new TableCell({
                                    children: [new Paragraph({
                                        children: [new TextRun({ text: String(label), font: "Georgia", size: 22 })]
                                    })],
                                    // 3.1 cm converts to exactly 1757 DXA
                                    width: { size: 1757, type: WidthType.DXA }, 
                                    margins: { top: 100, bottom: 100, left: 100, right: 100 }
                                }),
                                new TableCell({
                                    children: [new Paragraph({
                                        children: [new TextRun({ text: String(value), font: "Georgia", size: 22 })]
                                    })],
                                    // The remaining width of the standard page layout
                                    width: { size: 7603, type: WidthType.DXA },
                                    margins: { top: 100, bottom: 100, left: 100, right: 100 }
                                })
                            ]
                        });
                    };

                    const rows = [];
                    rows.push(createRow("Question", item.question || ""));
                    rows.push(createRow("Type", "multiple_choice"));

                    for(let i = 0; i < 4; i++) {
                        let optTxt = item.options && item.options[i] ? `${optLabels[i]}. ${item.options[i]}` : `${optLabels[i]}. `;
                        rows.push(createRow("Option", optTxt));
                    }

                    rows.push(createRow("Answer", ansIdx));
                    rows.push(createRow("Solution", ""));
                    rows.push(createRow("Positive Marks", "1"));
                    rows.push(createRow("Negative Marks", "0"));

                    // Compiles strict structural table matching Word defaults
                    const questionTable = new Table({
                        rows: rows,
                        width: { size: 9360, type: WidthType.DXA }, // Standard US Letter inner width
                        columnWidths: [1757, 7603],
                    });

                    childrenItems.push(questionTable);
                    childrenItems.push(new Paragraph({ text: "", spacing: { after: 400 } }));
                });

                const doc = new Document({
                    sections: [{
                        properties: {},
                        children: childrenItems
                    }]
                });

                const blob = await Packer.toBlob(doc);
                const url = URL.createObjectURL(blob);
                
                const downloadLink = document.createElement("a");
                downloadLink.href = url;
                downloadLink.download = fileName + ".docx"; 
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(url);
                
                showModal('File Downloaded!', `Your native file "${fileName}.docx" has been generated correctly and is ready to view.`, 'success', '✨');

            } catch (err) {
                console.error(err);
                showModal('Generation Failed', 'An error occurred while creating the Word file.', 'error', '❌');
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
