<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f0f9ff">
    <title>AgriQ Pro | Mission Analysis</title>
    
    <!-- Added 'Mukta' font for excellent Marathi typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Replaced jsPDF with html2pdf.js to leverage native browser Devanagari text shaping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #0084ff; --primary-glow: rgba(0, 132, 255, 0.1);
            --bg: #f0f9ff; --surface: #ffffff;
            --text-main: #002d4d; --text-dim: #64748b; --border: #e2e8f0;
            --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --neutral: #94a3b8;
            --glass: rgba(255, 255, 255, 0.85);
            --transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at top right, #e0f2fe, transparent);
            margin: 0; color: var(--text-main); min-height: 100vh; 
            display: flex; flex-direction: column; overflow-x: hidden; 
        }

        #analysis-loader {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #analysis-loader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; transition: 0.6s; }
        
        header {
            padding: calc(env(safe-area-inset-top) + 15px) 24px 15px;
            background: var(--glass); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .icon-btn {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; background: #fff;
            border: 1.5px solid var(--border); border-radius: 12px;
            color: var(--primary); text-decoration: none; transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .icon-btn:active { transform: scale(0.9); background: var(--primary-glow); }
        .profile-container { width: 40px; height: 40px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; }

        main { padding: 24px; max-width: 500px; margin: 0 auto; width: 100%; flex: 1; }

        /* Performance Summary Banner */
        .feedback-title { font-size: 20px; font-weight: 900; margin-bottom: 5px; color: var(--text-main); }
        .feedback-sub { font-size: 13px; color: var(--text-dim); font-weight: 600; margin-bottom: 25px; }

        .stat-banner { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { 
            background: #fff; border: 1.5px solid var(--border); 
            padding: 22px; border-radius: 24px; text-align: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.02); position: relative; overflow: hidden;
        }
        .stat-val { font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 900; display: block; color: var(--primary); line-height: 1.1; }
        .stat-lbl { font-size: 10px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; display: block; }

        /* Detailed Metrics - Circular Chart */
        .metrics-container { background: #fff; border: 1px solid var(--border); border-radius: 24px; padding: 25px 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; }
        .chart-title { font-size: 14px; font-weight: 900; color: var(--text-main); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .donut-chart { 
            width: 150px; height: 150px; border-radius: 50%; 
            background: #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .donut-inner {
            width: 110px; height: 110px; border-radius: 50%; background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono'; font-size: 28px; font-weight: 900; color: var(--text-main);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        .metric-grid { display: flex; justify-content: space-between; text-align: center; width: 100%; padding: 0 10px; }
        .metric-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .m-dot { width: 12px; height: 12px; border-radius: 50%; }
        .m-val { font-family: 'JetBrains Mono'; font-weight: 900; font-size: 18px; color: var(--text-main); }
        .m-lbl { font-size: 9px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; }

        /* Filter Pills */
        .filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 10px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-pill { 
            padding: 10px 16px; border-radius: 14px; background: #fff; border: 1.5px solid var(--border);
            font-size: 12px; font-weight: 800; color: var(--text-dim); cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .filter-pill.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }

        /* Analysis Cards */
        .analysis-card {
            background: #fff; border: 1.5px solid var(--border); border-radius: 24px; padding: 22px; margin-bottom: 16px;
            position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.02); animation: slideUp 0.5s ease backwards; transition: 0.3s;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .status-badge { position: absolute; top: 18px; right: 18px; font-size: 9px; font-weight: 900; padding: 6px 12px; border-radius: 50px; display: flex; align-items: center; gap: 4px; }
        .pass { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .fail { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .skip { background: rgba(0, 132, 255, 0.1); color: var(--primary); }

        /* Use Mukta for on-screen Marathi questions too */
        .q-title { font-family: 'Mukta', 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 16px; line-height: 1.5; margin-bottom: 18px; padding-right: 80px; color: var(--text-main); }
        
        .data-row { display: flex; align-items: center; gap: 12px; font-size: 14px; padding: 14px; background: var(--bg); border-radius: 16px; margin-top: 8px; font-family: 'Mukta', 'Plus Jakarta Sans', sans-serif; }
        .data-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); min-width: 60px; font-weight: 800; }

        .btn-group { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
        .btn-action { 
            padding: 20px; border-radius: 20px; border: none; font-weight: 900; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            gap: 10px; transition: 0.2s; font-size: 15px;
        }
        .btn-action.primary { background: var(--primary); color: #fff; box-shadow: 0 10px 25px var(--primary-glow); }
        .btn-action.outline { background: #fff; border: 1.5px solid var(--border); color: var(--text-main); }
        
        .view-options-btn {
            margin-top: 15px; display: inline-flex; align-items: center; gap: 6px;
            font-size: 10px; font-weight: 800; color: var(--primary); text-decoration: none;
            background: var(--primary-glow); padding: 8px 14px; border-radius: 10px;
            transition: 0.2s; font-family: 'JetBrains Mono';
        }
        .view-options-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="analysis-loader">
        <div style="color:var(--primary);"><i data-lucide="bar-chart-3" class="lucide lucide-bar-chart-3" size="64"></i></div>
        <p style="font-family:'JetBrains Mono'; font-size: 10px; color: var(--primary); margin-top: 15px; letter-spacing: 2px; font-weight: 800;">DECODING RESULTS...</p>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="profile-container" id="user-initial">U</div>
            <div style="font-weight: 900; font-size: 14px; letter-spacing: -0.5px;">AgriQ <span style="color:var(--primary);">ANALYSIS</span></div>
        </div>
        
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="leaderboard.html" class="icon-btn">
                <i data-lucide="trophy" size="20"></i>
            </a>
            <div id="user-tag" style="font-size: 10px; font-weight: 900; color: var(--primary); font-family: 'JetBrains Mono';">STUDENT</div>
        </div>
    </header>

    <main>
        <div>
            <h1 class="feedback-title" id="feedback-msg">Assessment Complete!</h1>
            <p class="feedback-sub">Here is your detailed performance breakdown.</p>
        </div>

        <div class="stat-banner">
            <div class="stat-card" style="border-color: var(--primary); background: #f0f9ff;">
                <span class="stat-val" id="acc-val">0%</span>
                <span class="stat-lbl">Accuracy Target</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="score-val" style="color: var(--text-main);">0<span style="font-size:18px; color:var(--text-dim)">/0</span></span>
                <span class="stat-lbl">Final Score</span>
            </div>
            <div class="stat-card" style="grid-column: span 2; border-color: #8b5cf6; background: #f5f3ff;">
                <span class="stat-val" id="mcaer-rank" style="color: #8b5cf6;">--</span>
                <span class="stat-lbl">Projected Rank</span>
                <div style="font-size: 9px; font-weight: 700; color: #a78bfa; margin-top: 6px; letter-spacing: 0.5px;">BASED ON CURRENT ACCURACY</div>
            </div>
        </div>

        <div class="metrics-container">
            <div class="chart-title">Assessing Questions</div>
            
            <div class="donut-chart" id="result-chart">
                <div class="donut-inner">
                    <span id="chart-acc-text">0%</span>
                </div>
            </div>

            <div class="metric-grid">
                <div class="metric-item">
                    <div class="m-dot" style="background:var(--success)"></div>
                    <span class="m-val" id="count-c">0</span>
                    <span class="m-lbl">Correct</span>
                </div>
                <div class="metric-item">
                    <div class="m-dot" style="background:var(--danger)"></div>
                    <span class="m-val" id="count-w">0</span>
                    <span class="m-lbl">Wrong</span>
                </div>
                <div class="metric-item">
                    <div class="m-dot" style="background:var(--primary)"></div>
                    <span class="m-val" id="count-s">0</span>
                    <span class="m-lbl">Skipped</span>
                </div>
            </div>
        </div>

        <div class="filter-scroll">
            <div class="filter-pill active" onclick="filterCards('all', this)">All Questions</div>
            <div class="filter-pill" onclick="filterCards('correct', this)">Correct <i data-lucide="check" size="12"></i></div>
            <div class="filter-pill" onclick="filterCards('wrong', this)">Wrong <i data-lucide="x" size="12"></i></div>
            <div class="filter-pill" onclick="filterCards('skipped', this)">Skipped <i data-lucide="minus" size="12"></i></div>
        </div>

        <div id="review-container"></div>

        <div class="btn-group">
            <button id="download-btn" class="btn-action outline" onclick="downloadMissedQuestionsPDF()" style="border-color: var(--primary); color: var(--primary);">
                <i data-lucide="download" size="20"></i> DOWNLOAD MISSED Qs
            </button>
            <button class="btn-action primary" onclick="window.location.href='leaderboard.html'">
                <i data-lucide="award" size="20"></i> VIEW RANKINGS
            </button>
            <button class="btn-action outline" onclick="window.location.href='dashboard.html'">
                <i data-lucide="layout-grid" size="20"></i> BACK TO DASHBOARD
            </button>
        </div>
    </main>

    <script>
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () { window.location.href = "dashboard.html"; };

        const firebaseConfig = {
            apiKey: "AIzaSyBFYdQZI4NXaqtWd4rEz3yL-0nw6PJqG6I",
            authDomain: "agri-mcar.firebaseapp.com",
            databaseURL: "https://agri-mcar-default-rtdb.firebaseio.com",
            projectId: "agri-mcar"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        document.addEventListener('DOMContentLoaded', () => {
            const cachedName = localStorage.getItem('agriq_cached_username') || "STUDENT";
            document.getElementById('user-tag').innerText = cachedName.toUpperCase();
            document.getElementById('user-initial').innerText = cachedName[0].toUpperCase();
            loadAnalysis();
        });

        auth.onAuthStateChanged(user => {
            if (!user) {
                if (!localStorage.getItem('agriq_last_result')) {
                    window.location.href = 'dashboard.html';
                }
                return;
            }
            db.ref(`students/${user.uid}`).once('value').then(snap => {
                const d = snap.val();
                if(d && d.name) {
                    const freshName = d.name.toUpperCase();
                    document.getElementById('user-tag').innerText = freshName;
                    document.getElementById('user-initial').innerText = freshName[0];
                    localStorage.setItem('agriq_cached_username', freshName);
                }
            }).catch(e => console.warn("Background fetch skipped. User is offline."));
        });

        function loadAnalysis() {
            const data = JSON.parse(localStorage.getItem('agriq_last_result'));
            if (!data) return; 

            const displayScore = (data.isRetake && data.rawScore !== undefined) ? data.rawScore : data.score;
            const calculatedAccuracy = Math.round((displayScore / data.total) * 100) || 0;

            document.getElementById('acc-val').innerText = `${calculatedAccuracy}%`;
            document.getElementById('score-val').innerHTML = `${displayScore}<span style="font-size:18px; color:var(--text-dim)">/${data.total}</span>`;
            document.getElementById('chart-acc-text').innerText = `${calculatedAccuracy}%`;

            let msg = "Keep Practicing!";
            if (calculatedAccuracy >= 90) msg = "Elite Performance! 🏆";
            else if (calculatedAccuracy >= 75) msg = "Outstanding Work! 🚀";
            else if (calculatedAccuracy >= 50) msg = "Good Job! 👍";
            document.getElementById('feedback-msg').innerText = msg;

            let predictedRank = "1500+";
            if (calculatedAccuracy >= 95) predictedRank = "1 - 50";
            else if (calculatedAccuracy >= 88) predictedRank = "51 - 150";
            else if (calculatedAccuracy >= 80) predictedRank = "151 - 400";
            else if (calculatedAccuracy >= 70) predictedRank = "401 - 800";
            else if (calculatedAccuracy >= 55) predictedRank = "801 - 1500";
            document.getElementById('mcaer-rank').innerText = predictedRank;

            let cCount = 0, wCount = 0, sCount = 0;
            const container = document.getElementById('review-container');
            container.innerHTML = ''; 
            
            data.details.forEach((item, i) => {
                let status = "wrong";
                let badgeClass = "fail";
                let badgeText = "WRONG";
                let badgeIcon = "x";
                let answerColor = "var(--danger)";

                if (item.user === item.actual) {
                    status = "correct";
                    badgeClass = "pass";
                    badgeText = "CORRECT";
                    badgeIcon = "check";
                    answerColor = "var(--success)";
                    cCount++;
                } else if (item.user === "SKIPPED") {
                    status = "skipped";
                    badgeClass = "skip";
                    badgeText = "SKIPPED";
                    badgeIcon = "minus";
                    answerColor = "var(--primary)";
                    sCount++;
                } else {
                    wCount++;
                }

                const card = document.createElement('div');
                card.className = `analysis-card type-${status}`;
                card.style.animationDelay = `${i * 0.05}s`;
                card.innerHTML = `
                    <span class="status-badge ${badgeClass}"><i data-lucide="${badgeIcon}" size="10"></i> ${badgeText}</span>
                    <div class="q-title"><span style="color:var(--text-dim); font-weight:800; font-family:'JetBrains Mono'; margin-right:5px;">Q${i+1}.</span> ${item.question}</div>
                    
                    <div class="data-row">
                        <span class="data-label">YOURS</span>
                        <span style="color:${answerColor}; font-weight:700;">${item.user}</span>
                    </div>
                    
                    ${status !== "correct" ? `
                    <div class="data-row" style="background: rgba(34, 197, 94, 0.05); border: 1px solid rgba(34, 197, 94, 0.2);">
                        <span class="data-label" style="color:var(--success);">CORRECT</span>
                        <span style="color:var(--success); font-weight:700;">${item.actual}</span>
                    </div>` : ''}
                    
                    <div style="text-align: right;">
                        <a href="test.html?reviewIndex=${i}" class="view-options-btn">
                            VIEW OPTIONS <i data-lucide="external-link" size="12"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('count-c').innerText = cCount;
            document.getElementById('count-w').innerText = wCount;
            document.getElementById('count-s').innerText = sCount;

            setTimeout(() => {
                const totalQ = data.total || 1;
                const cDeg = (cCount / totalQ) * 360;
                const wDeg = cDeg + ((wCount / totalQ) * 360);
                
                const chartElement = document.getElementById('result-chart');
                chartElement.style.background = `conic-gradient(var(--success) 0deg ${cDeg}deg, var(--danger) ${cDeg}deg ${wDeg}deg, var(--primary) ${wDeg}deg 360deg)`;
            }, 100);
            
            lucide.createIcons();
            setTimeout(() => document.getElementById('analysis-loader').classList.add('fade-out'), 400);
        }

        function filterCards(type, btn) {
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.analysis-card');
            cards.forEach(card => {
                if (type === 'all' || card.classList.contains(`type-${type}`)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // --- ENHANCED HTML2PDF GENERATION WITH MARATHI FONT SUPPORT ---
        function downloadMissedQuestionsPDF() {
            if (!window.html2pdf) {
                alert("The PDF generator is not available offline. Please connect to the internet to download this report.");
                return;
            }

            const data = JSON.parse(localStorage.getItem('agriq_last_result'));
            if (!data || !data.details) return;

            const missedQuestions = data.details.filter(item => item.user !== item.actual);

            if (missedQuestions.length === 0) {
                alert("Perfect score! You don't have any missed or skipped questions to download.");
                return;
            }

            // UI Feedback during generation
            const btn = document.getElementById('download-btn');
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" size="20" style="animation: spin 1s linear infinite;"></i> GENERATING PDF...`;
            
            // Re-initialize spinning icon
            if (window.lucide) { lucide.createIcons(); }

            const today = new Date();
            const formattedDate = today.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const displayScore = (data.isRetake && data.rawScore !== undefined) ? data.rawScore : data.score;
            const calcAcc = Math.round((displayScore / data.total) * 100) || 0;
            const userNameText = document.getElementById('user-tag') ? document.getElementById('user-tag').innerText : "STUDENT";

            // Create invisible DOM container to render HTML template
            const container = document.createElement('div');
            container.id = 'pdf-export-wrapper';
            
            // Build the HTML template replacing the former imperative coordinate setup
            let htmlContent = `
                <style>
                    /* Load Mukta to ensure excellent Marathi text rendering */
                    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap');
                    
                    #pdf-export-wrapper {
                        width: 794px;
                        padding: 40px;
                        background: #ffffff;
                        font-family: 'Mukta', 'Plus Jakarta Sans', sans-serif;
                        color: #002d4d;
                        box-sizing: border-box;
                    }
                    .pdf-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; border-bottom: 2px solid #0084ff; padding-bottom: 15px; }
                    .pdf-title { font-size: 32px; font-weight: 700; color: #002d4d; margin: 0; line-height: 1; font-family: 'Plus Jakarta Sans', sans-serif; }
                    .pdf-title span { color: #0084ff; }
                    .pdf-subtitle { font-size: 14px; color: #0084ff; font-weight: 600; }
                    
                    .pdf-info-box { border: 1.5px solid #002d4d; border-radius: 8px; padding: 18px; margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: #fafcff; }
                    .pdf-info-item { font-size: 14px; font-weight: 600; color: #334155; }
                    .pdf-info-item span { color: #0f172a; font-weight: 700; }
                    
                    .pdf-instructions { margin-bottom: 35px; background: #f8fafc; padding: 15px; border-radius: 8px; border-left: 4px solid #0084ff; }
                    .pdf-instructions h3 { color: #005096; font-size: 16px; margin: 0 0 10px 0; font-weight: 700; }
                    .pdf-instructions p { margin: 6px 0; font-size: 13px; color: #475569; line-height: 1.5; }
                    
                    /* page-break-inside: avoid ensures questions don't get cut in half */
                    .q-block { page-break-inside: avoid; margin-bottom: 24px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 18px; }
                    .q-text { font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 14px; line-height: 1.5; }
                    .q-text span { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #64748b; font-weight: 800; }
                    
                    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
                    .opt-item { font-size: 14px; display: flex; gap: 10px; line-height: 1.4; padding: 4px 0; }
                    .opt-label { font-weight: 700; }
                    
                    .opt-correct { color: #16a34a; font-weight: 600; background: #f0fdf4; padding: 4px 8px; border-radius: 6px; border: 1px solid #bbf7d0; }
                    .opt-wrong { color: #dc2626; font-weight: 600; background: #fef2f2; padding: 4px 8px; border-radius: 6px; border: 1px solid #fecaca; }
                    .opt-neutral { color: #475569; padding: 4px 8px; }
                    
                    .status-skipped { color: #0084ff; font-style: italic; font-size: 13px; margin-top: 10px; font-weight: 600; background: #eff6ff; display: inline-block; padding: 6px 12px; border-radius: 6px; border: 1px solid #bfdbfe; }
                    
                    .pdf-footer { margin-top: 40px; padding: 24px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; page-break-inside: avoid; text-align: center; }
                    .pdf-footer h4 { color: #002d4d; margin: 0 0 8px 0; font-size: 18px; font-weight: 700; }
                    .pdf-footer p { color: #64748b; font-size: 13px; margin: 0 auto 20px; line-height: 1.5; max-width: 600px; }
                    .pdf-footer-links { display: flex; justify-content: center; gap: 15px; }
                    .pdf-btn { padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 700; color: white; display: inline-block; }
                    .btn-wa { background: #25D366; }
                    .btn-app { background: #0084ff; }
                </style>
                
                <div class="pdf-header">
                    <h1 class="pdf-title">AgriQ <span>Pro</span></h1>
                    <div class="pdf-subtitle">MCAER PG CET - 2026</div>
                </div>
                
                <div class="pdf-info-box">
                    <div class="pdf-info-item">Date: <span>${formattedDate}</span></div>
                    <div class="pdf-info-item">Report: <span>Missed Questions Analysis</span></div>
                    <div class="pdf-info-item">Score: <span>${displayScore} / ${data.total} (${calcAcc}%)</span></div>
                    <div class="pdf-info-item">Needs Review: <span>${missedQuestions.length} Questions</span></div>
                    <div class="pdf-info-item" style="grid-column: span 2;">Candidate: <span>${userNameText}</span></div>
                </div>
                
                <div class="pdf-instructions">
                    <h3>Performance Review Guidelines:</h3>
                    <p>1. This document isolates the questions you answered incorrectly or chose to skip.</p>
                    <p>2. The correct answer is explicitly marked in green, while incorrect selections are flagged in red.</p>
                    <p>3. Use this targeted report to identify weak areas and apply active recall methods to master this material.</p>
                </div>
                
                <div class="questions-container">
            `;
            
            const optionLabels = ["A", "B", "C", "D"];
            
            missedQuestions.forEach((item, index) => {
                htmlContent += `<div class="q-block">
                    <div class="q-text"><span>Q${index + 1}.</span> ${item.question || "Unknown Question"}</div>`;
                    
                if (item.options && Array.isArray(item.options)) {
                    htmlContent += `<div class="opt-grid">`;
                    
                    const optionsToPrint = item.options.slice(0, 4);
                    optionsToPrint.forEach((opt, optIndex) => {
                        let isCorrect = (opt === item.actual);
                        let isUser = (opt === item.user);
                        
                        let optClass = "opt-neutral";
                        let suffix = "";
                        
                        if (isCorrect) { optClass = "opt-correct"; suffix = " (Correct)"; }
                        else if (isUser) { optClass = "opt-wrong"; suffix = " (Yours)"; }
                        
                        htmlContent += `
                        <div class="opt-item ${optClass}">
                            <span class="opt-label">[${optionLabels[optIndex]}]</span> 
                            <span>${opt}${suffix}</span>
                        </div>`;
                    });
                    
                    htmlContent += `</div>`;
                    
                    if (item.user === "SKIPPED") {
                        htmlContent += `<div class="status-skipped">Status: You skipped this question.</div>`;
                    }
                } else {
                    if (item.user === "SKIPPED") {
                        htmlContent += `<div class="status-skipped">Your Answer: SKIPPED</div>`;
                    } else {
                        htmlContent += `<div class="opt-wrong" style="display:inline-block; margin-bottom:8px;">Your Answer: ${item.user}</div><br>`;
                    }
                    htmlContent += `<div class="opt-correct" style="display:inline-block;">Correct Answer: ${item.actual}</div>`;
                }
                
                htmlContent += `</div>`;
            });
            
            htmlContent += `
                </div>
                
                <div class="pdf-footer">
                    <h4>About AgriQ Pro</h4>
                    <p>AgriQ Pro is your ultimate companion for agriculture competitive exams. Practice smarter, analyze your performance, and achieve top ranks with our specialized test series and tools.</p>
                    <div class="pdf-footer-links">
                        <span class="pdf-btn btn-wa">Join WhatsApp Group</span>
                        <span class="pdf-btn btn-app">Get AgriQ Pro App</span>
                    </div>
                </div>
            `;
            
            container.innerHTML = htmlContent;
            
            // Mount the container off-screen to render
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0';
            document.body.appendChild(container);
            
            const opt = {
                margin:       10, // mm margins
                filename:     'AgriQ_Missed_Questions.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(container).save().then(() => {
                document.body.removeChild(container);
                btn.innerHTML = originalBtnHTML; 
                if (window.lucide) { lucide.createIcons(); }
            }).catch(err => {
                console.error("PDF generation error: ", err);
                alert("An error occurred while generating the PDF. Please try again.");
                document.body.removeChild(container);
                btn.innerHTML = originalBtnHTML;
                if (window.lucide) { lucide.createIcons(); }
            });
        }
    </script>
    <style>
        /* Specific spinner animation class */
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
